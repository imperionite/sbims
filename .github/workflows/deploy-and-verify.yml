name: Deploy and Verify

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbims-deployment-main
  cancel-in-progress: true

env:
  DENO_VERSION: "2.9.4"
  DENO_ORG: "imperionite"
  DENO_APP: "sbims-dev"
  HEALTH_URL: "https://sbims-dev.imperionite.deno.net/api/v1/health"

jobs:

  # ============================================================
  # QUALITY VERIFICATION
  # ============================================================
  quality:
    name: SBIMS Pre-Deployment Quality Verification
    uses: ./.github/workflows/_quality-module.yml
    with:
      module: deployment-verification
    secrets: inherit

  # ============================================================
  # DEPLOY TO DENO DEPLOY
  # ============================================================
  deploy-deno:
    name: Deploy SBIMS to Deno Deploy
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deno-step.outputs.status }}
      time: ${{ steps.deno-step.outputs.time }}
      health: ${{ steps.health-step.outputs.health }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - id: deno-step
        name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          START=$(date +%s)

          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo "::error::DENO_DEPLOY_TOKEN GitHub secret is missing."
            exit 1
          fi

          deno deploy \
            --org "${DENO_ORG}" \
            --app "${DENO_APP}" \
            --prod

          END=$(date +%s)
          DURATION=$((END - START))

          echo "status=succeeded" >> $GITHUB_OUTPUT
          echo "time=${DURATION}s" >> $GITHUB_OUTPUT

      - id: health-step
        name: Health Check
        run: |
          MAX_ATTEMPTS=12
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "$HEALTH_URL")
            echo "Health check attempt $ATTEMPT: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "health=PASS" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "health=FAIL" >> $GITHUB_OUTPUT
              echo "::error::Health check failed."
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

  # ============================================================
  # DEPLOY TO CLOUDFLARE WORKERS
  # ============================================================
  deploy-cloudflare:
    name: Deploy SBIMS to Cloudflare Workers
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.cf-step.outputs.status }}
      time: ${{ steps.cf-step.outputs.time }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - id: cf-step
        name: Build and Deploy to Cloudflare Workers
        run: |
          START=$(date +%s)

          deno install

          deno task build

          END=$(date +%s)
          echo "time=$((END - START))s" >> $GITHUB_OUTPUT
          echo "status=succeeded" >> $GITHUB_OUTPUT

      - name: Deploy Action
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ============================================================
  # UNIFIED DEPLOYMENT REPORT
  # ============================================================
  report:
    name: SBIMS Deployment Report
    needs: [deploy-deno, deploy-cloudflare]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Unified Report
        run: |
          echo ""
          echo "======================================================================"
          echo "                 SBIMS UNIFIED DEPLOYMENT REPORT"
          echo "======================================================================"
          echo "Repository   : ${{ github.repository }}"
          echo "Branch       : ${{ github.ref_name }}"
          echo "Commit       : ${{ github.sha }}"
          echo "Actor        : ${{ github.actor }}"
          echo "Run ID       : ${{ github.run_id }}"
          echo ""
          echo "----------------------------------------------------------------------"
          echo " TARGET 1: DENO DEPLOY"
          echo "----------------------------------------------------------------------"
          echo " Organization : ${DENO_ORG}"
          echo " Application  : ${DENO_APP}"
          echo " Status       : ${{ needs.deploy-deno.result == 'success' && 'SUCCESS' || 'FAILED' }}"
          echo " Deploy Time  : ${{ needs.deploy-deno.outputs.time || 'N/A' }}"
          echo " Health URL   : ${HEALTH_URL}"
          echo " Health Check : ${{ needs.deploy-deno.outputs.health || 'FAILED' }}"
          echo ""
          echo "----------------------------------------------------------------------"
          echo " TARGET 2: CLOUDFLARE WORKERS"
          echo "----------------------------------------------------------------------"
          echo " Status       : ${{ needs.deploy-cloudflare.result == 'success' && 'SUCCESS' || 'FAILED' }}"
          echo " Build Time   : ${{ needs.deploy-cloudflare.outputs.time || 'N/A' }}"
          echo ""
          echo "======================================================================"

          if [ "${{ job.status }}" = "success" ]; then
            echo " STATUS : PASS - All deployments and verifications succeeded."
          else
            echo " STATUS : FAIL - One or more deployment targets failed."
            exit 1
          fi
