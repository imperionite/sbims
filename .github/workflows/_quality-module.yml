name: Module Quality Gate

on:
  workflow_call:
    inputs:
      module:
        description: "Module being tested"
        required: true
        type: string

      unit_task:
        description: "Unit-test task"
        required: true
        type: string

      integration_task:
        description: "Integration-test task"
        required: true
        type: string

    secrets:
      SUPABASE_URL:
        required: true

      SUPABASE_PUBLISHABLE_KEY:
        required: true

      SUPABASE_SECRET_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: SBIMS Quality Gate - ${{ inputs.module }}

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173

      RATE_LIMIT_ENABLED: false
      ENVIRONMENT: test

    steps:
      # ============================================
      # START TRACE
      # ============================================
      - name: Initialize CI Traceability
        run: |
          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          echo "START_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # DENO SETUP
      # ============================================

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.9.4

      - name: Cache Deno Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          deno cache src/main.ts
          deno cache "tests/unit/**/*.ts"
          deno cache "tests/integration/**/*.ts"

      # ============================================
      # FORMAT
      # ============================================

      - name: Format Check
        run: |
          START=$(date +%s)

          deno fmt --check

          END=$(date +%s)

          echo "FORMAT_TIME=$((END-START))s" >> "$GITHUB_ENV"

      # ============================================
      # LINT
      # ============================================

      - name: Lint Check
        run: |
          START=$(date +%s)

          deno lint

          END=$(date +%s)

          echo "LINT_TIME=$((END-START))s" >> "$GITHUB_ENV"

      # ============================================
      # TYPE CHECK
      # ============================================

      - name: Type Check
        run: |
          START=$(date +%s)

          deno check src/main.ts

          END=$(date +%s)

          echo "TYPE_TIME=$((END-START))s" >> "$GITHUB_ENV"

      # ============================================
      # UNIT TESTS
      # ============================================

      - name: Unit Tests (${{ inputs.module }})
        run: |
          START=$(date +%s)

          deno task "${{ inputs.unit_task }}"

          END=$(date +%s)

          echo "UNIT_TIME=$((END-START))s" >> "$GITHUB_ENV"

      # ============================================
      # INTEGRATION TESTS
      # ============================================

      - name: Integration Tests (${{ inputs.module }})
        run: |
          START=$(date +%s)

          deno task "${{ inputs.integration_task }}"

          END=$(date +%s)

          echo "INTEGRATION_TIME=$((END-START))s" >> "$GITHUB_ENV"

      # ============================================
      # FINAL REPORT
      # ============================================

      - name: SBIMS Quality Gate Report
        if: always()
        run: |

          END_TIME=$(date +%s)
          END_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          TOTAL=$((END_TIME-START_TIME))

          echo ""
          echo "======================================================================"
          echo "                     SBIMS QUALITY GATE"
          echo "======================================================================"

          echo ""

          echo "Module      : ${{ inputs.module }}"
          echo "Repository  : ${{ github.repository }}"
          echo "Workflow    : ${{ github.workflow }}"
          echo "Event       : ${{ github.event_name }}"

          echo ""

          echo "Base Branch : ${{ github.base_ref }}"
          echo "Head Branch : ${{ github.head_ref }}"

          echo "PR          : #${{ github.event.pull_request.number }}"
          echo "Commit      : ${{ github.sha }}"
          echo "Actor       : ${{ github.actor }}"
          echo "Run ID      : ${{ github.run_id }}"

          echo ""

          echo "Started     : $START_TIMESTAMP"
          echo "Finished    : $END_TIMESTAMP"

          echo ""

          echo "======================================================================"
          echo "QUALITY CHECKS"
          echo "======================================================================"

          echo ""

          echo "Format Check          ${FORMAT_TIME:-FAILED}"
          echo "Lint Check            ${LINT_TIME:-FAILED}"
          echo "Type Check            ${TYPE_TIME:-FAILED}"
          echo "Unit Tests            ${UNIT_TIME:-FAILED}"
          echo "Integration Tests     ${INTEGRATION_TIME:-FAILED}"

          echo ""

          echo "----------------------------------------------------------------------"
          echo "Total CI Duration : ${TOTAL}s"
          echo "----------------------------------------------------------------------"

          echo ""

          echo "======================================================================"
          echo "RESULT"
          echo "======================================================================"

          if [ "${{ job.status }}" = "success" ]; then

            echo ""
            echo "STATUS : PASS"
            echo ""
            echo "Quality Gate Passed"
            echo "Module : ${{ inputs.module }}"
            echo "Ready for Review"

          else

            echo ""
            echo "STATUS : FAIL"
            echo ""
            echo "Quality Gate Failed"
            echo "Module : ${{ inputs.module }}"
            echo "Fix required"
            exit 1

          fi
