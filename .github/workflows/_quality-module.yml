name: Module Quality Gate

on:
  workflow_call:
    inputs:
      module:
        description: "Module being tested"
        required: true
        type: string

      deno_version:
        description: "Deno version"
        required: false
        default: "2.9.7"
        type: string

      unit_task:
        description: "Unit-test task. Optional."
        required: false
        default: ""
        type: string

      integration_task:
        description: "Integration-test task. Optional."
        required: false
        default: ""
        type: string

      smoke_task:
        description: "Smoke-test task. Optional."
        required: false
        default: ""
        type: string

    secrets:
      SUPABASE_URL:
        required: true

      SUPABASE_PUBLISHABLE_KEY:
        required: true

      SUPABASE_SECRET_KEY:
        required: true

      UPSTASH_REDIS_REST_URL:
        required: true

      UPSTASH_REDIS_REST_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: SBIMS Quality Gate - ${{ inputs.module }}
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173

      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      RATE_LIMIT_ENABLED: "false"
      ENVIRONMENT: test

    steps:

      # ============================================================
      # INITIALIZE
      # ============================================================

      - name: Initialize CI Traceability
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p test-results

          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          echo "START_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # DENO SETUP
      # ============================================================

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ inputs.deno_version }}
          cache: true

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install Dependencies
        run: deno ci

      # ============================================================
      # VERIFY DEPENDENCY RESOLUTION
      # ============================================================

      - name: Verify Dependency Resolution
        run: deno info src/main.ts

      # ============================================================
      # FORMAT
      # ============================================================

      - name: Format Check
        shell: bash
        run: |
          set +e

          START=$(date +%s)

          deno fmt --check \
            2>&1 | tee test-results/format-check.txt

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "FORMAT_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "FORMAT_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FORMAT_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "FORMAT_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$EXIT_CODE"

      # ============================================================
      # LINT
      # ============================================================

      - name: Lint Check
        shell: bash
        run: |
          set +e

          START=$(date +%s)

          deno lint \
            2>&1 | tee test-results/lint-check.txt

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "LINT_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "LINT_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "LINT_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "LINT_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$EXIT_CODE"

      # ============================================================
      # TYPE CHECK
      # ============================================================

      - name: Type Check
        shell: bash
        run: |
          set +e

          START=$(date +%s)

          deno check src/main.ts \
            2>&1 | tee test-results/type-check.txt

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "TYPE_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "TYPE_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "TYPE_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "TYPE_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$EXIT_CODE"

      # ============================================================
      # UNIT TESTS
      # ============================================================

      - name: Unit Tests - ${{ inputs.module }}
        if: ${{ inputs.unit_task != '' }}
        shell: bash
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          set +e

          START=$(date +%s)

          echo "======================================================================"
          echo "UNIT TESTS - ${{ inputs.module }}"
          echo "======================================================================"
          echo ""

          deno task "${{ inputs.unit_task }}" \
            2>&1 | tee test-results/unit-tests.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "UNIT_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "UNIT_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "UNIT_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "UNIT_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # INTEGRATION TESTS
      # ============================================================

      - name: Integration Tests - ${{ inputs.module }}
        if: ${{ inputs.integration_task != '' }}
        shell: bash
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          set +e

          START=$(date +%s)

          echo "======================================================================"
          echo "INTEGRATION TESTS - ${{ inputs.module }}"
          echo "======================================================================"
          echo ""

          deno task "${{ inputs.integration_task }}" \
            2>&1 | tee test-results/integration-tests.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "INTEGRATION_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "INTEGRATION_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "INTEGRATION_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "INTEGRATION_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # SMOKE TESTS
      # ============================================================

      - name: Smoke Tests - ${{ inputs.module }}
        if: ${{ inputs.smoke_task != '' }}
        shell: bash
        env:
          RATE_LIMIT_ENABLED: "true"
        run: |
          set +e

          START=$(date +%s)

          echo "======================================================================"
          echo "SMOKE TESTS - ${{ inputs.module }}"
          echo "======================================================================"
          echo ""

          deno task "${{ inputs.smoke_task }}" \
            2>&1 | tee test-results/smoke-tests.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "SMOKE_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "SMOKE_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "SMOKE_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "SMOKE_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: SBIMS Quality Gate Report
        if: always()
        shell: bash
        run: |
          END_TIME=$(date +%s)
          END_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          TOTAL=$((END_TIME - START_TIME))

          echo ""
          echo "======================================================================"
          echo "                     SBIMS QUALITY GATE"
          echo "======================================================================"

          echo ""
          echo "Module      : ${{ inputs.module }}"
          echo "Repository  : ${{ github.repository }}"
          echo "Workflow    : ${{ github.workflow }}"
          echo "Event       : ${{ github.event_name }}"

          echo ""
          echo "Base Branch : ${{ github.base_ref || 'N/A' }}"
          echo "Head Branch : ${{ github.head_ref || 'N/A' }}"
          echo "PR          : #${{ github.event.pull_request.number || 'N/A' }}"
          echo "Commit      : ${{ github.sha }}"
          echo "Actor       : ${{ github.actor }}"
          echo "Run ID      : ${{ github.run_id }}"

          echo ""
          echo "Started     : $START_TIMESTAMP"
          echo "Finished    : $END_TIMESTAMP"

          # ==========================================================
          # QUALITY CHECKS
          # ==========================================================

          echo ""
          echo "======================================================================"
          echo "QUALITY CHECKS"
          echo "======================================================================"

          printf "%-25s %-12s %-12s\n" "Check" "Status" "Duration"
          echo "---------------------------------------------------------------------"

          printf "%-25s %-12s %-12s\n" \
            "Format Check" \
            "${FORMAT_STATUS:-FAIL}" \
            "${FORMAT_TIME:-N/A}"

          printf "%-25s %-12s %-12s\n" \
            "Lint Check" \
            "${LINT_STATUS:-FAIL}" \
            "${LINT_TIME:-N/A}"

          printf "%-25s %-12s %-12s\n" \
            "Type Check" \
            "${TYPE_STATUS:-FAIL}" \
            "${TYPE_TIME:-N/A}"

          if [ -n "${UNIT_TIME:-}" ]; then
            printf "%-25s %-12s %-12s\n" \
              "Unit Tests" \
              "${UNIT_STATUS:-FAIL}" \
              "${UNIT_TIME}"
          else
            printf "%-25s %-12s %-12s\n" \
              "Unit Tests" \
              "NOT RUN" \
              "N/A"
          fi

          if [ -n "${INTEGRATION_TIME:-}" ]; then
            printf "%-25s %-12s %-12s\n" \
              "Integration Tests" \
              "${INTEGRATION_STATUS:-FAIL}" \
              "${INTEGRATION_TIME}"
          else
            printf "%-25s %-12s %-12s\n" \
              "Integration Tests" \
              "NOT RUN" \
              "N/A"
          fi

          if [ -n "${SMOKE_TIME:-}" ]; then
            printf "%-25s %-12s %-12s\n" \
              "Smoke Tests" \
              "${SMOKE_STATUS:-FAIL}" \
              "${SMOKE_TIME}"
          else
            printf "%-25s %-12s %-12s\n" \
              "Smoke Tests" \
              "NOT RUN" \
              "N/A"
          fi

          # ==========================================================
          # TEST EVIDENCE SUMMARY
          # ==========================================================

          echo ""
          echo "======================================================================"
          echo "TEST EVIDENCE"
          echo "======================================================================"

          if [ -n "${UNIT_TIME:-}" ]; then
            echo ""
            echo "UNIT TESTS"
            echo "  Status     : ${UNIT_STATUS:-UNKNOWN}"
            echo "  Exit Code  : ${UNIT_EXIT_CODE:-N/A}"
            echo "  Duration   : ${UNIT_TIME}"
            echo "  Evidence   : test-results/unit-tests.txt"
          else
            echo ""
            echo "UNIT TESTS"
            echo "  Status     : NOT RUN"
          fi

          if [ -n "${INTEGRATION_TIME:-}" ]; then
            echo ""
            echo "INTEGRATION TESTS"
            echo "  Status     : ${INTEGRATION_STATUS:-UNKNOWN}"
            echo "  Exit Code  : ${INTEGRATION_EXIT_CODE:-N/A}"
            echo "  Duration   : ${INTEGRATION_TIME}"
            echo "  Evidence   : test-results/integration-tests.txt"
          else
            echo ""
            echo "INTEGRATION TESTS"
            echo "  Status     : NOT RUN"
          fi

          if [ -n "${SMOKE_TIME:-}" ]; then
            echo ""
            echo "SMOKE TESTS"
            echo "  Status     : ${SMOKE_STATUS:-UNKNOWN}"
            echo "  Exit Code  : ${SMOKE_EXIT_CODE:-N/A}"
            echo "  Duration   : ${SMOKE_TIME}"
            echo "  Evidence   : test-results/smoke-tests.txt"
          else
            echo ""
            echo "SMOKE TESTS"
            echo "  Status     : NOT RUN"
          fi

          # ==========================================================
          # TOTAL DURATION
          # ==========================================================

          echo ""
          echo "----------------------------------------------------------------------"
          echo "Total CI Duration : ${TOTAL}s"
          echo "----------------------------------------------------------------------"

          # ==========================================================
          # RESULT
          # ==========================================================

          echo ""
          echo "======================================================================"
          echo "RESULT"
          echo "======================================================================"

          if [ "${FORMAT_STATUS:-FAIL}" != "PASS" ] || \
             [ "${LINT_STATUS:-FAIL}" != "PASS" ] || \
             [ "${TYPE_STATUS:-FAIL}" != "PASS" ] || \
             { [ -n "${UNIT_EXIT_CODE:-}" ] && [ "${UNIT_EXIT_CODE}" != "0" ]; } || \
             { [ -n "${INTEGRATION_EXIT_CODE:-}" ] && [ "${INTEGRATION_EXIT_CODE}" != "0" ]; } || \
             { [ -n "${SMOKE_EXIT_CODE:-}" ] && [ "${SMOKE_EXIT_CODE}" != "0" ]; }; then

            OVERALL_STATUS="FAIL"

            echo ""
            echo "STATUS : FAIL"
            echo ""
            echo "Quality Gate Failed"
            echo "One or more quality checks failed."
            echo "Module : ${{ inputs.module }}"

          else

            OVERALL_STATUS="PASS"

            echo ""
            echo "STATUS : PASS"
            echo ""
            echo "Quality Gate Passed"
            echo "Module : ${{ inputs.module }}"

            if [ -z "${UNIT_TIME:-}" ] && \
               [ -z "${INTEGRATION_TIME:-}" ] && \
               [ -z "${SMOKE_TIME:-}" ]; then
              echo "Tests  : Not configured"
            else
              echo "Tests  : Configured"
            fi

          fi

          echo "OVERALL_STATUS=$OVERALL_STATUS" >> "$GITHUB_ENV"

          # ==========================================================
          # GITHUB STEP SUMMARY
          # ==========================================================

          {
            echo "# SBIMS Quality Gate"
            echo ""
            echo "## Run Information"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Module | \`${{ inputs.module }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Actor | \`${{ github.actor }}\` |"
            echo "| Run ID | \`${{ github.run_id }}\` |"
            echo "| Started | ${START_TIMESTAMP} |"
            echo "| Finished | ${END_TIMESTAMP} |"
            echo "| Total Duration | ${TOTAL}s |"

            echo ""
            echo "## Quality Checks"
            echo ""
            echo "| Check | Status | Duration |"
            echo "|---|---|---:|"
            echo "| Format Check | ${FORMAT_STATUS:-FAIL} | ${FORMAT_TIME:-N/A} |"
            echo "| Lint Check | ${LINT_STATUS:-FAIL} | ${LINT_TIME:-N/A} |"
            echo "| Type Check | ${TYPE_STATUS:-FAIL} | ${TYPE_TIME:-N/A} |"

            if [ -n "${UNIT_TIME:-}" ]; then
              echo "| Unit Tests | ${UNIT_STATUS:-FAIL} | ${UNIT_TIME} |"
            else
              echo "| Unit Tests | NOT RUN | N/A |"
            fi

            if [ -n "${INTEGRATION_TIME:-}" ]; then
              echo "| Integration Tests | ${INTEGRATION_STATUS:-FAIL} | ${INTEGRATION_TIME} |"
            else
              echo "| Integration Tests | NOT RUN | N/A |"
            fi

            if [ -n "${SMOKE_TIME:-}" ]; then
              echo "| Smoke Tests | ${SMOKE_STATUS:-FAIL} | ${SMOKE_TIME} |"
            else
              echo "| Smoke Tests | NOT RUN | N/A |"
            fi

            echo ""
            echo "## Unit Test Evidence"
            echo ""

            if [ -f test-results/unit-tests.txt ]; then
              echo '```text'
              cat test-results/unit-tests.txt
              echo '```'
            else
              echo "Unit tests were not configured."
            fi

            echo ""
            echo "## Integration Test Evidence"
            echo ""

            if [ -f test-results/integration-tests.txt ]; then
              echo '```text'
              cat test-results/integration-tests.txt
              echo '```'
            else
              echo "Integration tests were not configured."
            fi

            if [ -f test-results/smoke-tests.txt ]; then
              echo ""
              echo "## Smoke Test Evidence"
              echo ""
              echo '```text'
              cat test-results/smoke-tests.txt
              echo '```'
            fi

            echo ""
            echo "## Final Result"
            echo ""

            if [ "$OVERALL_STATUS" = "PASS" ]; then
              echo "### PASS"
              echo ""
              echo "All configured quality checks completed successfully."
            else
              echo "### FAIL"
              echo ""
              echo "One or more quality checks failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # UPLOAD TEST EVIDENCE
      # ============================================================

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbims-${{ inputs.module }}-test-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # ENFORCE QUALITY GATE
      # ============================================================

      - name: Enforce Quality Gate
        if: always()
        shell: bash
        run: |
          if [ "${OVERALL_STATUS:-FAIL}" != "PASS" ]; then
            echo "Quality Gate Failed."
            exit 1
          fi

          echo "Quality Gate Passed."
