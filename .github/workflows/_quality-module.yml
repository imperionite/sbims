name: Module Quality Gate

on:
  workflow_call:
    inputs:
      module:
        description: "Module being tested"
        required: true
        type: string

      deno_version:
        description: "Deno version"
        required: false
        default: "2.9.7"
        type: string

      unit_task:
        description: "Unit-test task. Optional."
        required: false
        default: ""
        type: string

      integration_task:
        description: "Integration-test task. Optional."
        required: false
        default: ""
        type: string

      smoke_task:
        description: "Smoke-test task. Optional."
        required: false
        default: ""
        type: string

    secrets:
      SUPABASE_URL:
        required: true

      SUPABASE_PUBLISHABLE_KEY:
        required: true

      SUPABASE_SECRET_KEY:
        required: true

      UPSTASH_REDIS_REST_URL:
        required: true

      UPSTASH_REDIS_REST_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: SBIMS Quality Gate - ${{ inputs.module }}

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173

      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      RATE_LIMIT_ENABLED: "false"
      ENVIRONMENT: test

    steps:

      # ============================================================
      # INITIALIZE
      # ============================================================
      - name: Initialize CI Traceability
        shell: bash
        run: |
          set -euo pipefail

          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          echo "START_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # DENO SETUP
      # ============================================================

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ inputs.deno_version }}
          cache: true

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          deno install --frozen

      # ============================================================
      # VERIFY DEPENDENCY RESOLUTION
      # ============================================================

      - name: Verify Dependency Resolution
        shell: bash
        run: |
          deno info src/main.ts

      # ============================================================
      # FORMAT
      # ============================================================

      - name: Format Check
        shell: bash
        run: |
          set +e

          START=$(date +%s)

          deno fmt --check

          EXIT_CODE=$?

          END=$(date +%s)

          echo "FORMAT_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "FORMAT_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FORMAT_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "FORMAT_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$EXIT_CODE"

      # ============================================================
      # LINT
      # ============================================================

      - name: Lint Check
        shell: bash
        run: |
          set +e

          START=$(date +%s)

          deno lint

          EXIT_CODE=$?

          END=$(date +%s)

          echo "LINT_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "LINT_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "LINT_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "LINT_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$EXIT_CODE"

      # ============================================================
      # TYPE CHECK
      # ============================================================

      - name: Type Check
        shell: bash
        run: |
          set +e

          START=$(date +%s)

          deno check src/main.ts

          EXIT_CODE=$?

          END=$(date +%s)

          echo "TYPE_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "TYPE_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "TYPE_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "TYPE_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$EXIT_CODE"

      # ============================================================
      # UNIT TESTS
      # ============================================================

      - name: Unit Tests - ${{ inputs.module }}
        if: ${{ inputs.unit_task != '' }}
        shell: bash
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          set +e

          START=$(date +%s)

          echo "======================================================================"
          echo "UNIT TESTS - ${{ inputs.module }}"
          echo "======================================================================"
          echo ""

          deno task "${{ inputs.unit_task }}" \
            2>&1 | tee unit-output.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          END=$(date +%s)

          echo "UNIT_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "UNIT_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "UNIT_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "UNIT_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # INTEGRATION TESTS
      # ============================================================

      - name: Integration Tests - ${{ inputs.module }}
        if: ${{ inputs.integration_task != '' }}
        shell: bash
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          set +e

          START=$(date +%s)

          echo "======================================================================"
          echo "INTEGRATION TESTS - ${{ inputs.module }}"
          echo "======================================================================"
          echo ""

          deno task "${{ inputs.integration_task }}" \
            2>&1 | tee integration-output.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          END=$(date +%s)

          echo "INTEGRATION_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "INTEGRATION_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "INTEGRATION_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "INTEGRATION_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # SMOKE TESTS
      # ============================================================

      - name: Smoke Tests - ${{ inputs.module }}
        if: ${{ inputs.smoke_task != '' }}
        shell: bash
        env:
          RATE_LIMIT_ENABLED: "true"
        run: |
          set +e

          START=$(date +%s)

          echo "======================================================================"
          echo "SMOKE TESTS - ${{ inputs.module }}"
          echo "======================================================================"
          echo ""

          deno task "${{ inputs.smoke_task }}" \
            2>&1 | tee smoke-output.txt

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          END=$(date +%s)

          echo "SMOKE_TIME=$((END - START))s" >> "$GITHUB_ENV"
          echo "SMOKE_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "SMOKE_STATUS=PASS" >> "$GITHUB_ENV"
          else
            echo "SMOKE_STATUS=FAIL" >> "$GITHUB_ENV"
          fi

          exit "$TEST_EXIT_CODE"

      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: SBIMS Quality Gate Report
        if: always()
        shell: bash
        run: |
          END_TIME=$(date +%s)
          END_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          TOTAL=$((END_TIME - START_TIME))

          # ----------------------------------------------------------
          # DETERMINE FINAL STATUS
          # ----------------------------------------------------------

          OVERALL_STATUS="PASS"

          if [ "${FORMAT_STATUS:-FAIL}" != "PASS" ]; then
            OVERALL_STATUS="FAIL"
          fi

          if [ "${LINT_STATUS:-FAIL}" != "PASS" ]; then
            OVERALL_STATUS="FAIL"
          fi

          if [ "${TYPE_STATUS:-FAIL}" != "PASS" ]; then
            OVERALL_STATUS="FAIL"
          fi

          if [ -n "${UNIT_EXIT_CODE:-}" ] && \
             [ "${UNIT_EXIT_CODE}" != "0" ]; then
            OVERALL_STATUS="FAIL"
          fi

          if [ -n "${INTEGRATION_EXIT_CODE:-}" ] && \
             [ "${INTEGRATION_EXIT_CODE}" != "0" ]; then
            OVERALL_STATUS="FAIL"
          fi

          if [ -n "${SMOKE_EXIT_CODE:-}" ] && \
             [ "${SMOKE_EXIT_CODE}" != "0" ]; then
            OVERALL_STATUS="FAIL"
          fi

          echo "OVERALL_STATUS=$OVERALL_STATUS" >> "$GITHUB_ENV"

          # ----------------------------------------------------------
          # CONSOLE REPORT
          # ----------------------------------------------------------

          echo ""
          echo "======================================================================"
          echo "                     SBIMS QUALITY GATE"
          echo "======================================================================"

          echo ""
          echo "Module      : ${{ inputs.module }}"
          echo "Repository  : ${{ github.repository }}"
          echo "Workflow    : ${{ github.workflow }}"
          echo "Event       : ${{ github.event_name }}"
          echo "Commit      : ${{ github.sha }}"
          echo "Run ID      : ${{ github.run_id }}"

          echo ""
          echo "Started     : $START_TIMESTAMP"
          echo "Finished    : $END_TIMESTAMP"

          echo ""
          echo "======================================================================"
          echo "QUALITY CHECKS"
          echo "======================================================================"

          printf "%-25s %-12s %-12s\n" "Check" "Status" "Duration"
          echo "---------------------------------------------------------------------"

          printf "%-25s %-12s %-12s\n" \
            "Format Check" \
            "${FORMAT_STATUS:-FAIL}" \
            "${FORMAT_TIME:-N/A}"

          printf "%-25s %-12s %-12s\n" \
            "Lint Check" \
            "${LINT_STATUS:-FAIL}" \
            "${LINT_TIME:-N/A}"

          printf "%-25s %-12s %-12s\n" \
            "Type Check" \
            "${TYPE_STATUS:-FAIL}" \
            "${TYPE_TIME:-N/A}"

          printf "%-25s %-12s %-12s\n" \
            "Unit Tests" \
            "${UNIT_STATUS:-NOT RUN}" \
            "${UNIT_TIME:-N/A}"

          printf "%-25s %-12s %-12s\n" \
            "Integration Tests" \
            "${INTEGRATION_STATUS:-NOT RUN}" \
            "${INTEGRATION_TIME:-N/A}"

          printf "%-25s %-12s %-12s\n" \
            "Smoke Tests" \
            "${SMOKE_STATUS:-NOT RUN}" \
            "${SMOKE_TIME:-N/A}"

          echo ""
          echo "----------------------------------------------------------------------"
          echo "Total CI Duration : ${TOTAL}s"
          echo "----------------------------------------------------------------------"

          echo ""
          echo "======================================================================"
          echo "RESULT"
          echo "======================================================================"

          echo ""
          echo "STATUS : ${OVERALL_STATUS}"
          echo "Module : ${{ inputs.module }}"

          # ----------------------------------------------------------
          # GITHUB ACTIONS SUMMARY
          # ----------------------------------------------------------

          {
            echo "# SBIMS Quality Gate"
            echo ""

            echo "## Run Information"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Module | \`${{ inputs.module }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Run ID | \`${{ github.run_id }}\` |"
            echo "| Started | ${START_TIMESTAMP} |"
            echo "| Finished | ${END_TIMESTAMP} |"
            echo "| Total Duration | ${TOTAL}s |"

            echo ""
            echo "## Quality Checks"
            echo ""
            echo "| Check | Status | Duration |"
            echo "|---|---|---:|"

            echo "| Format Check | ${FORMAT_STATUS:-FAIL} | ${FORMAT_TIME:-N/A} |"
            echo "| Lint Check | ${LINT_STATUS:-FAIL} | ${LINT_TIME:-N/A} |"
            echo "| Type Check | ${TYPE_STATUS:-FAIL} | ${TYPE_TIME:-N/A} |"
            echo "| Unit Tests | ${UNIT_STATUS:-NOT RUN} | ${UNIT_TIME:-N/A} |"
            echo "| Integration Tests | ${INTEGRATION_STATUS:-NOT RUN} | ${INTEGRATION_TIME:-N/A} |"
            echo "| Smoke Tests | ${SMOKE_STATUS:-NOT RUN} | ${SMOKE_TIME:-N/A} |"

            # --------------------------------------------------------
            # UNIT TEST EVIDENCE
            # --------------------------------------------------------

            echo ""
            echo "## Unit Test Evidence"
            echo ""

            if [ -n "${UNIT_TIME:-}" ] && [ -f unit-output.txt ]; then

              echo '```text'
              cat unit-output.txt
              echo '```'

            elif [ -n "${UNIT_TIME:-}" ]; then

              echo "Unit tests executed, but no test output was captured."

            else

              echo "Unit tests were not configured."

            fi

            # --------------------------------------------------------
            # INTEGRATION TEST EVIDENCE
            # --------------------------------------------------------

            echo ""
            echo "## Integration Test Evidence"
            echo ""

            if [ -n "${INTEGRATION_TIME:-}" ] && \
               [ -f integration-output.txt ]; then

              echo '```text'
              cat integration-output.txt
              echo '```'

            elif [ -n "${INTEGRATION_TIME:-}" ]; then

              echo "Integration tests executed, but no test output was captured."

            else

              echo "Integration tests were not configured."

            fi

            # --------------------------------------------------------
            # SMOKE TEST EVIDENCE
            # --------------------------------------------------------

            if [ -n "${SMOKE_TIME:-}" ] && [ -f smoke-output.txt ]; then

              echo ""
              echo "## Smoke Test Evidence"
              echo ""

              echo '```text'
              cat smoke-output.txt
              echo '```'

            fi

            # --------------------------------------------------------
            # FINAL RESULT
            # --------------------------------------------------------

            echo ""
            echo "## Final Result"
            echo ""

            if [ "$OVERALL_STATUS" = "PASS" ]; then

              echo "### PASS"
              echo ""
              echo "All configured quality checks completed successfully."

            else

              echo "### FAIL"
              echo ""
              echo "One or more quality checks failed."

            fi

          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # ENFORCE QUALITY GATE
      # ============================================================

      - name: Enforce Quality Gate
        if: always()
        shell: bash
        run: |
          if [ "${OVERALL_STATUS:-FAIL}" != "PASS" ]; then
            echo "Quality Gate Failed."
            exit 1
          fi

          echo "Quality Gate Passed."
