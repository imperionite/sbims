name: Security Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest

    env:
      SECURITY_TARGET_URL: ${{ secrets.SECURITY_TARGET_URL }}
      SECURITY_PROTECTED_PATH: ${{ secrets.SECURITY_PROTECTED_PATH }}

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================================
      # INITIALIZE
      # ==========================================================

      - name: Initialize security baseline
        shell: bash
        run: |
          set -u

          mkdir -p security-baseline

          cat > security-baseline/results.env <<'EOF'
          TARGET_STATUS=NOT_RUN
          GITLEAKS_STATUS=NOT_RUN
          DENO_STATUS=NOT_RUN
          CODEQL_STATUS=NOT_RUN
          ZAP_STATUS=NOT_RUN
          API_STATUS=NOT_RUN
          API_HEALTH_STATUS=NOT_RUN
          API_AUTH_STATUS=NOT_RUN
          API_HEADERS_STATUS=NOT_RUN
          API_CORS_STATUS=NOT_RUN
          EOF

      # ==========================================================
      # RUN INFORMATION
      # ==========================================================

      - name: Record run information
        shell: bash
        run: |
          {
            echo "# Security Baseline"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Repository | ${GITHUB_REPOSITORY} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Run ID | ${GITHUB_RUN_ID} |"
            echo "| Trigger | ${GITHUB_EVENT_NAME} |"
            echo "| Target configured | $([ -n "${SECURITY_TARGET_URL:-}" ] && echo "YES" || echo "NO") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # TARGET CONNECTIVITY
      # ==========================================================

      - name: Verify security target
        id: target
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            echo "SECURITY_TARGET_URL is not configured."
            sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
              security-baseline/results.env
            exit 1
          fi

          echo "Checking security target..."

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/target-body.txt \
              --dump-header security-baseline/target-headers.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$SECURITY_TARGET_URL"
          )"

          CURL_STATUS=$?

          echo "HTTP status: $HTTP_STATUS"
          echo "curl exit code: $CURL_STATUS"

          if [ "$CURL_STATUS" -eq 0 ] &&
             [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then

            sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=PASS/' \
              security-baseline/results.env

            exit 0
          fi

          sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
            security-baseline/results.env

          exit 1

      # ==========================================================
      # GITLEAKS
      # ==========================================================

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Record Gitleaks result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            sed -i 's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i 's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # DENO
      # ==========================================================

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Run Deno dependency audit
        id: deno-audit
        continue-on-error: true
        shell: bash
        run: |
          set +e

          deno audit > security-baseline/deno-audit.txt 2>&1

          STATUS=$?

          echo "$STATUS" > security-baseline/deno-audit.exit

          cat security-baseline/deno-audit.txt

          exit "$STATUS"

      - name: Record Deno audit result
        if: always()
        shell: bash
        run: |
          STATUS="$(
            cat security-baseline/deno-audit.exit 2>/dev/null || echo 1
          )"

          if [ "$STATUS" = "0" ]; then
            sed -i 's/^DENO_STATUS=.*/DENO_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i 's/^DENO_STATUS=.*/DENO_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # CODEQL
      # ==========================================================

      - name: Initialize CodeQL
        id: codeql-init
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        id: codeql-analyze
        if: always() && steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Record CodeQL result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.codeql-init.outcome }}" = "success" ] &&
             [ "${{ steps.codeql-analyze.outcome }}" = "success" ]; then

            sed -i 's/^CODEQL_STATUS=.*/CODEQL_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i 's/^CODEQL_STATUS=.*/CODEQL_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

      # ==========================================================
      # ZAP TARGET CONNECTIVITY
      # ==========================================================

      - name: Verify ZAP target
        id: zap-target
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            echo "SECURITY_TARGET_URL is not configured."
            exit 1
          fi

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$SECURITY_TARGET_URL"
          )"

          CURL_STATUS=$?

          echo "ZAP target HTTP status: $HTTP_STATUS"
          echo "curl exit code: $CURL_STATUS"

          if [ "$CURL_STATUS" -eq 0 ] &&
             [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then
            exit 0
          fi

          exit 1

      # ==========================================================
      # OWASP ZAP BASELINE
      # ==========================================================

      - name: OWASP ZAP Baseline Scan
        id: zap
        if: always() && steps.zap-target.outcome == 'success'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.SECURITY_TARGET_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Record ZAP result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.zap-target.outcome }}" = "success" ] &&
             [ "${{ steps.zap.outcome }}" = "success" ]; then

            sed -i 's/^ZAP_STATUS=.*/ZAP_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i 's/^ZAP_STATUS=.*/ZAP_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

      # ==========================================================
      # API SECURITY PROBES
      # ==========================================================

      - name: API security control probes
        id: api-probes
        if: always() && steps.target.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          BASE_URL="${SECURITY_TARGET_URL%/}"

          # ------------------------------------------------------
          # Validate protected path configuration
          # ------------------------------------------------------

          if [ -z "${SECURITY_PROTECTED_PATH:-}" ]; then
            echo "SECURITY_PROTECTED_PATH is not configured."

            cat > security-baseline/api-results.env <<'EOF'
          HEALTH_STATUS=N/A
          HEALTH_RESULT=NOT RUN
          PROTECTED_STATUS=N/A
          AUTH_RESULT=NOT CONFIGURED
          HEADER_RESULT=NOT RUN
          CORS_RESULT=NOT RUN
          EOF

            sed -i 's/^API_STATUS=.*/API_STATUS=NOT VERIFIED/' \
              security-baseline/results.env

            exit 0
          fi

          # ------------------------------------------------------
          # Health / public endpoint
          # ------------------------------------------------------

          HEALTH_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/health-body.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$BASE_URL"
          )"

          HEALTH_CURL_STATUS=$?

          echo "Health endpoint HTTP status: $HEALTH_STATUS"

          if [ "$HEALTH_CURL_STATUS" -eq 0 ] &&
             [ "$HEALTH_STATUS" -ge 200 ] &&
             [ "$HEALTH_STATUS" -lt 400 ]; then

            HEALTH_RESULT="PASS"

          else

            HEALTH_RESULT="REVIEW"

          fi

          # ------------------------------------------------------
          # Protected endpoint without Authorization
          # ------------------------------------------------------

          PROTECTED_URL="${BASE_URL}/${SECURITY_PROTECTED_PATH#/}"

          echo "Testing protected endpoint:"
          echo "$PROTECTED_URL"

          PROTECTED_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/protected-body.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$PROTECTED_URL"
          )"

          PROTECTED_CURL_STATUS=$?

          echo "Protected endpoint HTTP status: $PROTECTED_STATUS"

          if [ "$PROTECTED_CURL_STATUS" -ne 0 ]; then

            AUTH_RESULT="REVIEW"

          else

            case "$PROTECTED_STATUS" in

              401|403)
                AUTH_RESULT="PASS"
                ;;

              404)
                AUTH_RESULT="NOT VERIFIED"
                ;;

              200|201|202|204|301|302|307|308)
                AUTH_RESULT="FAIL"
                ;;

              *)
                AUTH_RESULT="REVIEW"
                ;;

            esac

          fi

          # ------------------------------------------------------
          # Security headers
          # ------------------------------------------------------

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/security-headers.txt \
            --output /dev/null \
            --max-time 20 \
            "$BASE_URL"

          HEADER_CURL_STATUS=$?

          if [ "$HEADER_CURL_STATUS" -ne 0 ]; then

            HEADER_RESULT="REVIEW"
            HEADER_FINDINGS="Unable to retrieve response headers."

          else

            HEADER_FINDINGS=""

            if ! grep -qi '^strict-transport-security:' \
              security-baseline/security-headers.txt; then
              HEADER_FINDINGS="${HEADER_FINDINGS} HSTS;"
            fi

            if ! grep -qi '^x-content-type-options:' \
              security-baseline/security-headers.txt; then
              HEADER_FINDINGS="${HEADER_FINDINGS} X-Content-Type-Options;"
            fi

            if ! grep -qi '^content-security-policy:' \
              security-baseline/security-headers.txt; then
              HEADER_FINDINGS="${HEADER_FINDINGS} CSP;"
            fi

            if [ -z "$HEADER_FINDINGS" ]; then
              HEADER_RESULT="PASS"
            else
              HEADER_RESULT="REVIEW"
            fi

          fi

          # ------------------------------------------------------
          # CORS observation
          # ------------------------------------------------------

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/cors-headers.txt \
            --output /dev/null \
            --max-time 20 \
            -H "Origin: https://security-baseline-invalid.example" \
            "$BASE_URL"

          CORS_CURL_STATUS=$?

          if [ "$CORS_CURL_STATUS" -ne 0 ]; then

            CORS_RESULT="REVIEW"

          elif grep -qi \
            '^access-control-allow-origin: https://security-baseline-invalid.example' \
            security-baseline/cors-headers.txt; then

            CORS_RESULT="REVIEW"

          elif grep -qi \
            '^access-control-allow-origin: \*' \
            security-baseline/cors-headers.txt; then

            CORS_RESULT="REVIEW"

          else

            CORS_RESULT="OBSERVED"

          fi

          # ------------------------------------------------------
          # Determine API overall status
          # ------------------------------------------------------

          if [ "$HEALTH_RESULT" = "PASS" ] &&
             [ "$AUTH_RESULT" = "PASS" ] &&
             [ "$HEADER_RESULT" = "PASS" ]; then

            API_RESULT="PASS"

          elif [ "$AUTH_RESULT" = "NOT VERIFIED" ] ||
               [ "$AUTH_RESULT" = "NOT CONFIGURED" ]; then

            API_RESULT="NOT VERIFIED"

          elif [ "$AUTH_RESULT" = "FAIL" ] ||
               [ "$HEADER_RESULT" = "REVIEW" ] ||
               [ "$CORS_RESULT" = "REVIEW" ] ||
               [ "$HEALTH_RESULT" = "REVIEW" ]; then

            API_RESULT="REVIEW"

          else

            API_RESULT="REVIEW"

          fi

          # ------------------------------------------------------
          # Save API results
          # ------------------------------------------------------

          cat > security-baseline/api-results.env <<EOF
          HEALTH_STATUS=$HEALTH_STATUS
          HEALTH_RESULT=$HEALTH_RESULT
          PROTECTED_STATUS=$PROTECTED_STATUS
          AUTH_RESULT=$AUTH_RESULT
          HEADER_RESULT=$HEADER_RESULT
          HEADER_FINDINGS=$HEADER_FINDINGS
          CORS_RESULT=$CORS_RESULT
          EOF

          sed -i "s/^API_STATUS=.*/API_STATUS=$API_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_HEALTH_STATUS=.*/API_HEALTH_STATUS=$HEALTH_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_AUTH_STATUS=.*/API_AUTH_STATUS=$AUTH_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_HEADERS_STATUS=.*/API_HEADERS_STATUS=$HEADER_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_CORS_STATUS=.*/API_CORS_STATUS=$CORS_RESULT/" \
            security-baseline/results.env

          exit 0

      # ==========================================================
      # FINAL CONSOLIDATED DASHBOARD
      # ==========================================================

      - name: Generate security baseline dashboard
        if: always()
        shell: bash
        run: |
          set +e

          source security-baseline/results.env

          if [ -f security-baseline/api-results.env ]; then
            source security-baseline/api-results.env
          else
            HEALTH_STATUS="N/A"
            HEALTH_RESULT="NOT RUN"
            PROTECTED_STATUS="N/A"
            AUTH_RESULT="NOT RUN"
            HEADER_RESULT="NOT RUN"
            HEADER_FINDINGS=""
            CORS_RESULT="NOT RUN"
          fi

          # ------------------------------------------------------
          # Calculate overall status
          # ------------------------------------------------------

          OVERALL="PASS"

          for STATUS in \
            "$TARGET_STATUS" \
            "$GITLEAKS_STATUS" \
            "$DENO_STATUS" \
            "$CODEQL_STATUS" \
            "$ZAP_STATUS" \
            "$API_STATUS"
          do

            if [ "$STATUS" = "FAIL" ]; then

              OVERALL="FAIL"

            elif [ "$STATUS" = "REVIEW" ] ||
                 [ "$STATUS" = "NOT VERIFIED" ]; then

              if [ "$OVERALL" != "FAIL" ]; then
                OVERALL="REVIEW REQUIRED"
              fi

            fi

          done

          # ------------------------------------------------------
          # Determine key findings
          # ------------------------------------------------------

          DEPENDENCY_FINDING="None reported"

          if [ "$DENO_STATUS" = "REVIEW" ]; then
            DEPENDENCY_FINDING="See Deno audit output"
          fi

          # ------------------------------------------------------
          # GitHub Summary
          # ------------------------------------------------------

          {
            echo "# Security Baseline"
            echo ""

            echo "## Executive Status"
            echo ""
            echo '```text'
            echo "=============================================================="
            echo "                    SECURITY BASELINE"
            echo "=============================================================="
            printf '%-30s %s\n' "Overall Status" "$OVERALL"
            printf '%-30s %s\n' "Repository" "$GITHUB_REPOSITORY"
            printf '%-30s %s\n' "Commit" "${GITHUB_SHA:0:12}"
            printf '%-30s %s\n' "Run ID" "$GITHUB_RUN_ID"
            echo "=============================================================="
            echo '```'
            echo ""

            echo "## Control Dashboard"
            echo ""
            echo '```text'
            printf '%-32s %-18s\n' "CONTROL" "STATUS"
            printf '%-32s %-18s\n' \
              "--------------------------------" \
              "------------------"

            printf '%-32s %-18s\n' \
              "Target Connectivity" \
              "$TARGET_STATUS"

            printf '%-32s %-18s\n' \
              "Gitleaks" \
              "$GITLEAKS_STATUS"

            printf '%-32s %-18s\n' \
              "Dependency Audit" \
              "$DENO_STATUS"

            printf '%-32s %-18s\n' \
              "CodeQL" \
              "$CODEQL_STATUS"

            printf '%-32s %-18s\n' \
              "OWASP ZAP Baseline" \
              "$ZAP_STATUS"

            printf '%-32s %-18s\n' \
              "API Security Controls" \
              "$API_STATUS"

            echo '```'
            echo ""

            echo "## API Security Controls"
            echo ""
            echo '```text'

            printf '%-34s %-12s %-18s\n' \
              "CONTROL" \
              "HTTP" \
              "RESULT"

            printf '%-34s %-12s %-18s\n' \
              "----------------------------------" \
              "------------" \
              "------------------"

            printf '%-34s %-12s %-18s\n' \
              "Health / public endpoint" \
              "${HEALTH_STATUS:-N/A}" \
              "${HEALTH_RESULT:-NOT RUN}"

            printf '%-34s %-12s %-18s\n' \
              "Protected endpoint / no auth" \
              "${PROTECTED_STATUS:-N/A}" \
              "${AUTH_RESULT:-NOT RUN}"

            printf '%-34s %-12s %-18s\n' \
              "Security headers" \
              "N/A" \
              "${HEADER_RESULT:-NOT RUN}"

            printf '%-34s %-12s %-18s\n' \
              "CORS observation" \
              "N/A" \
              "${CORS_RESULT:-NOT RUN}"

            echo '```'
            echo ""

            echo "## Dependency Audit"
            echo ""

            if [ "$DENO_STATUS" = "PASS" ]; then

              echo "**Status:** PASS"
              echo ""
              echo "No known dependency vulnerabilities were reported."

            else

              echo "**Status:** REVIEW REQUIRED"
              echo ""
              echo "The dependency audit reported one or more findings."
              echo ""
              echo '```text'

              cat security-baseline/deno-audit.txt 2>/dev/null \
                || echo "No audit output available."

              echo '```'

            fi

            echo ""

            echo "## Current Dependency Finding"
            echo ""

            if grep -q "undici" security-baseline/deno-audit.txt 2>/dev/null; then

              echo '```text'
              grep -A5 -B1 "undici" security-baseline/deno-audit.txt
              echo '```'
              echo ""
              echo "The vulnerability is transitive and should be resolved through the dependency chain rather than suppressed."

            else

              echo "No undici finding was reported by this run."

            fi

            echo ""

            echo "## API Interpretation"
            echo ""

            case "$AUTH_RESULT" in

              PASS)
                echo "Unauthenticated access to the configured protected endpoint was rejected with HTTP 401/403."
                ;;

              "NOT VERIFIED")
                echo "The configured protected endpoint returned HTTP 404."
                echo ""
                echo "Authentication protection could not be verified because the requested route was not found."
                ;;

              FAIL)
                echo "The configured protected endpoint returned a successful/redirect response without authentication."
                echo ""
                echo "This requires security review."
                ;;

              "NOT CONFIGURED")
                echo "No protected endpoint path was configured."
                ;;

              *)
                echo "The authentication control could not be conclusively evaluated."
                ;;

            esac

            echo ""

            echo "## Security Header Findings"
            echo ""

            if [ "$HEADER_RESULT" = "PASS" ]; then

              echo "Required baseline security headers were observed."

            else

              echo "Header review required."

              if [ -n "${HEADER_FINDINGS:-}" ]; then
                echo ""
                echo "Observed missing/unchecked headers:"
                echo ""
                echo "\`${HEADER_FINDINGS}\`"
              fi

            fi

            echo ""

            echo "## CORS"
            echo ""

            case "$CORS_RESULT" in

              REVIEW)
                echo "Review required: the response permits the probe origin or otherwise requires CORS configuration review."
                ;;

              OBSERVED)
                echo "No unsafe wildcard/probe-origin CORS response was observed by this probe."
                echo ""
                echo "This is an observation, not a complete CORS security assessment."
                ;;

              *)
                echo "CORS could not be conclusively evaluated."
                ;;

            esac

            echo ""

            echo "## Security Scope"
            echo ""
            echo "This workflow provides automated security baseline characterization through:"
            echo ""
            echo "- Secret scanning"
            echo "- Dependency vulnerability auditing"
            echo "- CodeQL static analysis"
            echo "- OWASP ZAP passive baseline scanning"
            echo "- API authentication boundary probing"
            echo "- Security-header observation"
            echo "- CORS observation"
            echo ""
            echo "This is not a penetration test and does not establish the absence of security vulnerabilities."
            echo ""

          } >> "$GITHUB_STEP_SUMMARY"

          # ------------------------------------------------------
          # Console dashboard
          # ------------------------------------------------------

          echo ""
          echo "=============================================================="
          echo "                    SECURITY BASELINE"
          echo "=============================================================="
          printf '%-30s %s\n' "OVERALL STATUS" "$OVERALL"
          echo "--------------------------------------------------------------"
          printf '%-30s %s\n' "Target Connectivity" "$TARGET_STATUS"
          printf '%-30s %s\n' "Gitleaks" "$GITLEAKS_STATUS"
          printf '%-30s %s\n' "Dependency Audit" "$DENO_STATUS"
          printf '%-30s %s\n' "CodeQL" "$CODEQL_STATUS"
          printf '%-30s %s\n' "OWASP ZAP" "$ZAP_STATUS"
          printf '%-30s %s\n' "API Security" "$API_STATUS"
          echo "=============================================================="
          echo ""

          echo "API CONTROLS"
          echo "--------------------------------------------------------------"
          printf '%-34s %-10s %-18s\n' \
            "Health endpoint" \
            "${HEALTH_STATUS:-N/A}" \
            "${HEALTH_RESULT:-NOT RUN}"

          printf '%-34s %-10s %-18s\n' \
            "Protected endpoint" \
            "${PROTECTED_STATUS:-N/A}" \
            "${AUTH_RESULT:-NOT RUN}"

          printf '%-34s %-10s %-18s\n' \
            "Security headers" \
            "N/A" \
            "${HEADER_RESULT:-NOT RUN}"

          printf '%-34s %-10s %-18s\n' \
            "CORS" \
            "N/A" \
            "${CORS_RESULT:-NOT RUN}"

          echo "=============================================================="
          echo ""

      # ==========================================================
      # UPLOAD SECURITY ARTIFACTS
      # ==========================================================

      - name: Upload security baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline-${{ github.run_id }}
          path: security-baseline/
          if-no-files-found: warn
