name: Security Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest

    env:
      SECURITY_TARGET_URL: ${{ secrets.SECURITY_TARGET_URL }}
      SECURITY_PROTECTED_PATH: ${{ secrets.SECURITY_PROTECTED_PATH }}
      SECURITY_TEST_EMAIL: ${{ secrets.SECURITY_TEST_EMAIL }}
      SECURITY_TEST_PASSWORD: ${{ secrets.SECURITY_TEST_PASSWORD }}

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Initialize results
      # ------------------------------------------------------------
      - name: Initialize security results
        shell: bash
        run: |
          set -u

          mkdir -p security-baseline

          cat > security-baseline/results.env <<'EOF'
          GITLEAKS_RESULT=NOT_VERIFIED
          DENO_AUDIT_RESULT=NOT_VERIFIED
          CODEQL_RESULT=NOT_VERIFIED
          ZAP_RESULT=NOT_VERIFIED

          HEALTH_RESULT=NOT_VERIFIED
          AUTH_ME_NO_TOKEN_RESULT=NOT_VERIFIED
          LOGIN_RESULT=NOT_VERIFIED
          AUTH_ME_RESULT=NOT_VERIFIED
          PROTECTED_NO_AUTH_RESULT=NOT_VERIFIED
          PROTECTED_AUTH_RESULT=NOT_VERIFIED
          INVALID_TOKEN_RESULT=NOT_VERIFIED
          HEADERS_RESULT=NOT_VERIFIED
          CORS_RESULT=NOT_VERIFIED

          API_RESULT=NOT_VERIFIED
          EOF

      # ------------------------------------------------------------
      # 3. Run information
      # ------------------------------------------------------------
      - name: Record run information
        shell: bash
        run: |
          {
            echo "# Security Baseline"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Repository | $GITHUB_REPOSITORY |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Run ID | $GITHUB_RUN_ID |"
            echo "| Trigger | $GITHUB_EVENT_NAME |"
            echo "| Target configured | $([ -n "$SECURITY_TARGET_URL" ] && echo "YES" || echo "NO") |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 4. Target connectivity
      # ------------------------------------------------------------
      - name: Check target connectivity
        shell: bash
        run: |
          set -u

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            echo "SECURITY_TARGET_URL is not configured."
            exit 1
          fi

          echo "Security target configured."
          echo "Target host: $(printf '%s' "$SECURITY_TARGET_URL" | sed -E 's#https?://([^/]+).*#\1#')"

          if curl \
            --silent \
            --show-error \
            --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 20 \
            "$SECURITY_TARGET_URL" > security-baseline/target-status.txt; then

            echo "Target connectivity check completed."
          else
            echo "Target connectivity check failed."
            exit 1
          fi

      # ------------------------------------------------------------
      # 5. Gitleaks
      # ------------------------------------------------------------
      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Gitleaks result
        shell: bash
        run: |
          set -u

          # The action exit code is exposed through the step outcome.
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            RESULT="PASS"
          else
            RESULT="REVIEW"
          fi

          sed -i "s/^GITLEAKS_RESULT=.*/GITLEAKS_RESULT=$RESULT/" \
            security-baseline/results.env

          {
            echo
            echo "## Secret Exposure Assessment"
            echo
            echo "| Assessment | Tool / Method | Result |"
            echo "|---|---|---|"
            echo "| Secret exposure | Gitleaks | $RESULT |"
            echo
            if [ "$RESULT" = "PASS" ]; then
              echo "Gitleaks reported no detected secret leaks according to its configured rules."
            else
              echo "Gitleaks requires review. Inspect the Gitleaks findings before interpreting the result."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 6. Deno setup
      # ------------------------------------------------------------
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ------------------------------------------------------------
      # 7. Deno audit
      # ------------------------------------------------------------
      - name: Run Deno dependency audit
        id: deno-audit
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          echo "Running Deno dependency audit..."

          if deno audit 2>&1 | tee security-baseline/deno-audit.txt; then
            RESULT="PASS"
          else
            RESULT="REVIEW"
          fi

          sed -i "s/^DENO_AUDIT_RESULT=.*/DENO_AUDIT_RESULT=$RESULT/" \
            security-baseline/results.env

          echo "Deno Audit Result: $RESULT"

      # ------------------------------------------------------------
      # 8. CodeQL initialization
      # ------------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        id: codeql
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:javascript-typescript"

      - name: Record CodeQL result
        shell: bash
        run: |
          set -u

          if [ "${{ steps.codeql.outcome }}" = "success" ]; then
            RESULT="PASS"
          else
            RESULT="REVIEW"
          fi

          sed -i "s/^CODEQL_RESULT=.*/CODEQL_RESULT=$RESULT/" \
            security-baseline/results.env

          {
            echo
            echo "## Static Security Assessment"
            echo
            echo "| Assessment | Tool / Method | Result |"
            echo "|---|---|---|"
            echo "| Static application security | GitHub CodeQL | $RESULT |"
            echo
            echo "CodeQL was executed using the security-extended query set for JavaScript/TypeScript."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 9. OWASP ZAP Baseline
      # ------------------------------------------------------------
      - name: Run OWASP ZAP Baseline
        id: zap
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: ${{ env.SECURITY_TARGET_URL }}
          cmd_options: "-m 2"

      - name: Record ZAP result
        shell: bash
        run: |
          set -u

          ZAP_OUTCOME="${{ steps.zap.outcome }}"

          if [ "$ZAP_OUTCOME" = "success" ]; then
            RESULT="PASS"
          else
            RESULT="REVIEW"
          fi

          sed -i "s/^ZAP_RESULT=.*/ZAP_RESULT=$RESULT/" \
            security-baseline/results.env

          {
            echo
            echo "## Passive Web/API Security Assessment"
            echo
            echo "| Assessment | Tool / Method | Result |"
            echo "|---|---|---|"
            echo "| Passive API/web scan | OWASP ZAP Baseline | $RESULT |"
            echo
            echo "OWASP ZAP Baseline performs passive analysis. Its findings require interpretation according to the deployed API and application context."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 10. API security profile
      # ------------------------------------------------------------
      - name: Run API security profile
        shell: bash
        run: |
          set -u

          source security-baseline/results.env

          BASE_URL="${SECURITY_TARGET_URL%/}"

          HEALTH_URL="${BASE_URL}/api/v1/health"
          LOGIN_URL="${BASE_URL}/api/v1/auth/login"
          ME_URL="${BASE_URL}/api/v1/auth/me"
          PROTECTED_URL="${BASE_URL}/${SECURITY_PROTECTED_PATH#/}"

          echo "Running API security profile..."

          # ----------------------------------------------------------
          # Helper
          # ----------------------------------------------------------
          check_status() {
            local name="$1"
            local actual="$2"
            shift 2

            local expected
            for expected in "$@"; do
              if [ "$actual" = "$expected" ]; then
                echo "$name: PASS ($actual)"
                return 0
              fi
            done

            echo "$name: FAIL ($actual)"
            return 1
          }

          # ----------------------------------------------------------
          # 10.1 Public health endpoint
          # ----------------------------------------------------------
          HEALTH_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              "$HEALTH_URL"
          )"

          if check_status "Public health endpoint" "$HEALTH_STATUS" 200; then
            HEALTH_RESULT="PASS"
          else
            HEALTH_RESULT="FAIL"
          fi

          # ----------------------------------------------------------
          # 10.2 /auth/me without token
          # ----------------------------------------------------------
          AUTH_ME_NO_TOKEN_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              "$ME_URL"
          )"

          if check_status \
            "/auth/me without token" \
            "$AUTH_ME_NO_TOKEN_STATUS" \
            401 403; then
            AUTH_ME_NO_TOKEN_RESULT="PASS"
          else
            AUTH_ME_NO_TOKEN_RESULT="FAIL"
          fi

          # ----------------------------------------------------------
          # 10.3 Login with dedicated security test account
          # ----------------------------------------------------------
          LOGIN_RESPONSE_FILE="security-baseline/login-response.json"

          if [ -z "${SECURITY_TEST_EMAIL:-}" ] ||
             [ -z "${SECURITY_TEST_PASSWORD:-}" ]; then

            echo "Security test credentials are not configured."
            LOGIN_RESULT="NOT_VERIFIED"
            AUTH_TOKEN=""
          else
            LOGIN_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --request POST \
                --header 'Content-Type: application/json' \
                --data "$(jq -n \
                  --arg email "$SECURITY_TEST_EMAIL" \
                  --arg password "$SECURITY_TEST_PASSWORD" \
                  '{email: $email, password: $password}')" \
                --output "$LOGIN_RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --max-time 20 \
                "$LOGIN_URL"
            )"

            if check_status "Login with test credentials" "$LOGIN_STATUS" 200; then
              LOGIN_RESULT="PASS"

              AUTH_TOKEN="$(
                jq -r '.data.accessToken // empty' \
                  "$LOGIN_RESPONSE_FILE"
              )"

              if [ -z "$AUTH_TOKEN" ]; then
                echo "Login returned HTTP 200 but no access token was found."
                LOGIN_RESULT="FAIL"
              else
                echo "Access token obtained: YES"
              fi
            else
              LOGIN_RESULT="FAIL"
              AUTH_TOKEN=""
            fi
          fi

          # Never print the login response.
          rm -f "$LOGIN_RESPONSE_FILE"

          # ----------------------------------------------------------
          # 10.4 /auth/me with valid token
          # ----------------------------------------------------------
          if [ -n "${AUTH_TOKEN:-}" ]; then
            AUTH_ME_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 20 \
                --header "Authorization: Bearer $AUTH_TOKEN" \
                "$ME_URL"
            )"

            if check_status "/auth/me with valid token" "$AUTH_ME_STATUS" 200; then
              AUTH_ME_RESULT="PASS"
            else
              AUTH_ME_RESULT="FAIL"
            fi
          else
            AUTH_ME_RESULT="NOT_VERIFIED"
          fi

          # ----------------------------------------------------------
          # 10.5 Protected route without authentication
          # ----------------------------------------------------------
          PROTECTED_NO_AUTH_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              "$PROTECTED_URL"
          )"

          if check_status \
            "Protected route without token" \
            "$PROTECTED_NO_AUTH_STATUS" \
            401 403; then
            PROTECTED_NO_AUTH_RESULT="PASS"
          else
            if [ "$PROTECTED_NO_AUTH_STATUS" = "404" ]; then
              echo "Protected route without token: NOT VERIFIED (404 route not established)"
              PROTECTED_NO_AUTH_RESULT="NOT_VERIFIED"
            else
              PROTECTED_NO_AUTH_RESULT="FAIL"
            fi
          fi

          # ----------------------------------------------------------
          # 10.6 Protected route with valid authentication
          # ----------------------------------------------------------
          if [ -n "${AUTH_TOKEN:-}" ]; then
            PROTECTED_AUTH_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 20 \
                --header "Authorization: Bearer $AUTH_TOKEN" \
                "$PROTECTED_URL"
            )"

            case "$PROTECTED_AUTH_STATUS" in
              200|201|202|204)
                echo "Protected route with valid token: PASS ($PROTECTED_AUTH_STATUS)"
                PROTECTED_AUTH_RESULT="PASS"
                ;;
              401)
                echo "Protected route with valid token: FAIL (401)"
                PROTECTED_AUTH_RESULT="FAIL"
                ;;
              403)
                echo "Protected route with valid token: REVIEW (403)"
                echo "The test account may not have permission to access the selected protected route."
                PROTECTED_AUTH_RESULT="REVIEW"
                ;;
              404)
                echo "Protected route with valid token: NOT VERIFIED (404)"
                PROTECTED_AUTH_RESULT="NOT_VERIFIED"
                ;;
              *)
                echo "Protected route with valid token: REVIEW ($PROTECTED_AUTH_STATUS)"
                PROTECTED_AUTH_RESULT="REVIEW"
                ;;
            esac
          else
            PROTECTED_AUTH_RESULT="NOT_VERIFIED"
          fi

          # ----------------------------------------------------------
          # 10.7 Invalid bearer token
          # ----------------------------------------------------------
          INVALID_TOKEN_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              --header 'Authorization: Bearer invalid.security.baseline.token' \
              "$ME_URL"
          )"

          if check_status \
            "Invalid bearer token" \
            "$INVALID_TOKEN_STATUS" \
            401 403; then
            INVALID_TOKEN_RESULT="PASS"
          else
            INVALID_TOKEN_RESULT="FAIL"
          fi

          # ----------------------------------------------------------
          # 10.8 Security response headers
          # ----------------------------------------------------------
          HEADERS_FILE="security-baseline/headers.txt"

          curl \
            --silent \
            --show-error \
            --location \
            --dump-header "$HEADERS_FILE" \
            --output /dev/null \
            --max-time 20 \
            "$HEALTH_URL"

          HSTS_PRESENT="NO"
          XCTO_PRESENT="NO"

          if grep -qi '^strict-transport-security:' "$HEADERS_FILE"; then
            HSTS_PRESENT="YES"
          fi

          if grep -qi '^x-content-type-options:' "$HEADERS_FILE"; then
            XCTO_PRESENT="YES"
          fi

          if [ "$HSTS_PRESENT" = "YES" ] &&
             [ "$XCTO_PRESENT" = "YES" ]; then
            HEADERS_RESULT="PASS"
          else
            HEADERS_RESULT="OBSERVED"
          fi

          # ----------------------------------------------------------
          # 10.9 CORS controlled observation
          # ----------------------------------------------------------
          CORS_RESPONSE_FILE="security-baseline/cors-response.txt"

          curl \
            --silent \
            --show-error \
            --location \
            --dump-header "$CORS_RESPONSE_FILE" \
            --output /dev/null \
            --max-time 20 \
            --header 'Origin: https://security-baseline-invalid.example' \
            "$HEALTH_URL"

          if grep -Eiq \
            '^access-control-allow-origin:[[:space:]]*(\*|https://security-baseline-invalid\.example)[[:space:]]*$' \
            "$CORS_RESPONSE_FILE"; then

            CORS_RESULT="REVIEW"
          else
            CORS_RESULT="OBSERVED"
          fi

          # ----------------------------------------------------------
          # Save results
          # ----------------------------------------------------------
          cat > security-baseline/results.env <<EOF
          GITLEAKS_RESULT=$GITLEAKS_RESULT
          DENO_AUDIT_RESULT=$DENO_AUDIT_RESULT
          CODEQL_RESULT=$CODEQL_RESULT
          ZAP_RESULT=$ZAP_RESULT

          HEALTH_RESULT=$HEALTH_RESULT
          AUTH_ME_NO_TOKEN_RESULT=$AUTH_ME_NO_TOKEN_RESULT
          LOGIN_RESULT=$LOGIN_RESULT
          AUTH_ME_RESULT=$AUTH_ME_RESULT
          PROTECTED_NO_AUTH_RESULT=$PROTECTED_NO_AUTH_RESULT
          PROTECTED_AUTH_RESULT=$PROTECTED_AUTH_RESULT
          INVALID_TOKEN_RESULT=$INVALID_TOKEN_RESULT
          HEADERS_RESULT=$HEADERS_RESULT
          CORS_RESULT=$CORS_RESULT
          EOF

          # ----------------------------------------------------------
          # Overall API result
          # ----------------------------------------------------------
          if [ "$HEALTH_RESULT" = "FAIL" ] ||
             [ "$AUTH_ME_NO_TOKEN_RESULT" = "FAIL" ] ||
             [ "$LOGIN_RESULT" = "FAIL" ] ||
             [ "$AUTH_ME_RESULT" = "FAIL" ] ||
             [ "$PROTECTED_NO_AUTH_RESULT" = "FAIL" ] ||
             [ "$PROTECTED_AUTH_RESULT" = "FAIL" ] ||
             [ "$INVALID_TOKEN_RESULT" = "FAIL" ]; then

            API_RESULT="FAIL"

          elif [ "$CORS_RESULT" = "REVIEW" ] ||
               [ "$PROTECTED_AUTH_RESULT" = "REVIEW" ]; then

            API_RESULT="REVIEW"

          elif [ "$HEALTH_RESULT" = "PASS" ] &&
               [ "$AUTH_ME_NO_TOKEN_RESULT" = "PASS" ] &&
               [ "$LOGIN_RESULT" = "PASS" ] &&
               [ "$AUTH_ME_RESULT" = "PASS" ] &&
               [ "$PROTECTED_NO_AUTH_RESULT" = "PASS" ] &&
               [ "$PROTECTED_AUTH_RESULT" = "PASS" ] &&
               [ "$INVALID_TOKEN_RESULT" = "PASS" ]; then

            API_RESULT="PASS"

          else
            API_RESULT="NOT_VERIFIED"
          fi

          echo "API_RESULT=$API_RESULT" >> security-baseline/results.env

      # ------------------------------------------------------------
      # 11. API security profile report
      # ------------------------------------------------------------
      - name: Publish API security profile
        shell: bash
        run: |
          set -u

          source security-baseline/results.env

          {
            echo
            echo "## Security Assessment Methods"
            echo
            echo "| Assessment Area | Tool / Method | Purpose |"
            echo "|---|---|---|"
            echo "| Secret exposure | Gitleaks | Detect committed secrets and credentials |"
            echo "| Dependency vulnerabilities | Deno Audit | Identify reported dependency vulnerabilities |"
            echo "| Static security analysis | GitHub CodeQL | Analyze JavaScript/TypeScript code for security-relevant patterns |"
            echo "| Passive web/API analysis | OWASP ZAP Baseline | Identify passive web/API security observations |"
            echo "| Runtime authentication | curl API probes | Verify authenticated and unauthenticated endpoint behavior |"
            echo "| Authorization | curl API probes | Verify protected-resource access behavior |"
            echo "| Invalid credential handling | curl API probes | Verify invalid bearer tokens are rejected |"
            echo "| Security headers | curl | Observe HTTP security response headers |"
            echo "| CORS behavior | curl with controlled Origin | Observe cross-origin response behavior |"
            echo
            echo "## Security Assessment Results"
            echo
            echo "| Assessment | Tool / Method | Result |"
            echo "|---|---|---|"
            echo "| Secret exposure | Gitleaks | $GITLEAKS_RESULT |"
            echo "| Dependency audit | Deno Audit | $DENO_AUDIT_RESULT |"
            echo "| Static application security | GitHub CodeQL | $CODEQL_RESULT |"
            echo "| Passive API/web scan | OWASP ZAP Baseline | $ZAP_RESULT |"
            echo "| Runtime API security | curl probes | $API_RESULT |"
            echo
            echo "## API Security Profile"
            echo
            echo "| Security Control | Tool / Method | Expected | Observed | Result |"
            echo "|---|---|---|---|---|"
            echo "| Public health endpoint | curl | HTTP 200 | $HEALTH_RESULT | $HEALTH_RESULT |"
            echo "| /auth/me without token | curl | HTTP 401/403 | $AUTH_ME_NO_TOKEN_RESULT | $AUTH_ME_NO_TOKEN_RESULT |"
            echo "| Login with test credentials | curl + test account | Successful authentication | $LOGIN_RESULT | $LOGIN_RESULT |"
            echo "| /auth/me with valid token | curl + Bearer token | HTTP 200 | $AUTH_ME_RESULT | $AUTH_ME_RESULT |"
            echo "| Protected route without token | curl | HTTP 401/403 | $PROTECTED_NO_AUTH_RESULT | $PROTECTED_NO_AUTH_RESULT |"
            echo "| Protected route with valid token | curl + Bearer token | Authorized response | $PROTECTED_AUTH_RESULT | $PROTECTED_AUTH_RESULT |"
            echo "| Invalid bearer token | curl | HTTP 401/403 | $INVALID_TOKEN_RESULT | $INVALID_TOKEN_RESULT |"
            echo "| Security headers | curl response headers | Headers observed | HSTS=$HSTS_PRESENT; X-Content-Type-Options=$XCTO_PRESENT | $HEADERS_RESULT |"
            echo "| CORS | curl with controlled Origin | No unauthorized origin reflection | $CORS_RESULT | $CORS_RESULT |"
            echo
            echo "## Endpoint Configuration"
            echo
            echo "| Endpoint | Path |"
            echo "|---|---|"
            echo "| Health | /api/v1/health |"
            echo "| Login | /api/v1/auth/login |"
            echo "| Current user | /api/v1/auth/me |"
            echo "| Protected test route | ${SECURITY_PROTECTED_PATH} |"
            echo
            echo "## Result Semantics"
            echo
            echo "| Result | Meaning |"
            echo "|---|---|"
            echo "| PASS | Expected control behavior was observed |"
            echo "| FAIL | Expected behavior was not observed |"
            echo "| REVIEW | Observation requires contextual/manual interpretation |"
            echo "| NOT VERIFIED | The test could not establish the control |"
            echo "| OBSERVED | The behavior was recorded without assigning a security pass/fail judgment |"
            echo
            echo "## Interpretation"
            echo
            echo "- This workflow characterizes implemented security controls using complementary static, dependency, passive, and runtime checks."
            echo "- Gitleaks reports detected secret exposure according to its configured detection rules; a PASS does not prove that no secret exists anywhere."
            echo "- Deno Audit, CodeQL, and OWASP ZAP findings should be interpreted using their reported severity and the application context."
            echo "- The API profile verifies selected authentication and authorization behaviors through deterministic HTTP probes."
            echo "- Security headers and CORS are reported as observations unless the workflow has a deterministic expected result."
            echo "- The workflow does not constitute a complete penetration test or a proof that the application is secure."
            echo "- Rate-limit testing is intentionally not performed as an aggressive repeated probe against the evaluation target."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 12. Save raw security evidence
      # ------------------------------------------------------------
      - name: Upload security baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline-${{ github.run_id }}
          path: security-baseline/
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 13. Final workflow status
      # ------------------------------------------------------------
      - name: Enforce security baseline failure conditions
        if: always()
        shell: bash
        run: |
          set -u

          source security-baseline/results.env

          echo "Security baseline results:"
          echo "Gitleaks: $GITLEAKS_RESULT"
          echo "Deno Audit: $DENO_AUDIT_RESULT"
          echo "CodeQL: $CODEQL_RESULT"
          echo "ZAP: $ZAP_RESULT"
          echo "API: $API_RESULT"

          # The baseline intentionally does not fail the entire workflow
          # merely because a contextual REVIEW/OBSERVED result exists.
          #
          # Deterministic API failures are treated as workflow failures.
          if [ "$API_RESULT" = "FAIL" ]; then
            echo "Security baseline failed because a deterministic API security control failed."
            exit 1
          fi

          echo "Security baseline completed."
