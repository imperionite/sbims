name: Security Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# ==============================================================
# REQUIRED GITHUB SECRETS
#
# SECURITY_TARGET_URL
#   https://api.sbims.me
#
# SECURITY_PROTECTED_PATH
#   /api/v1/students
#
# SECURITY_TEST_EMAIL
#   Dedicated security-baseline test account email
#
# SECURITY_TEST_PASSWORD
#   Dedicated security-baseline test account password
#
# All are stored under:
# Repository → Settings → Secrets and variables → Actions
#
# The test credentials are used only to establish an authenticated
# API session during the manually triggered security baseline.
# ==============================================================

jobs:
  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest

    env:
      SECURITY_TARGET_URL: ${{ secrets.SECURITY_TARGET_URL }}
      SECURITY_PROTECTED_PATH: ${{ secrets.SECURITY_PROTECTED_PATH }}

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================================
      # INITIALIZE
      # ==========================================================

      - name: Initialize security baseline
        shell: bash
        run: |
          set -u

          mkdir -p security-baseline

          cat > security-baseline/results.env <<'EOF'
          TARGET_STATUS=NOT_RUN
          GITLEAKS_STATUS=NOT_RUN
          DENO_STATUS=NOT_RUN
          CODEQL_STATUS=NOT_RUN
          ZAP_STATUS=NOT_RUN
          API_STATUS=NOT_RUN
          API_HEALTH_STATUS=NOT_RUN
          API_AUTH_STATUS=NOT_RUN
          API_HEADERS_STATUS=NOT_RUN
          API_CORS_STATUS=NOT_RUN
          EOF

      # ==========================================================
      # RUN INFORMATION
      # ==========================================================

      - name: Record run information
        shell: bash
        run: |
          {
            echo "# Security Baseline"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Repository | ${GITHUB_REPOSITORY} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Run ID | ${GITHUB_RUN_ID} |"
            echo "| Trigger | ${GITHUB_EVENT_NAME} |"
            echo "| Target configured | $([ -n "${SECURITY_TARGET_URL:-}" ] && echo "YES" || echo "NO") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # TARGET CONNECTIVITY
      # ==========================================================

      - name: Verify security target
        id: target
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            echo "SECURITY_TARGET_URL is not configured."
            sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
              security-baseline/results.env
            exit 1
          fi

          echo "Checking security target..."

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/target-body.txt \
              --dump-header security-baseline/target-headers.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$SECURITY_TARGET_URL"
          )"

          CURL_STATUS=$?

          echo "HTTP status: $HTTP_STATUS"
          echo "curl exit code: $CURL_STATUS"

          if [ "$CURL_STATUS" -eq 0 ] &&
             [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then

            sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=PASS/' \
              security-baseline/results.env

            exit 0
          fi

          sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
            security-baseline/results.env

          exit 1

      # ==========================================================
      # GITLEAKS
      # ==========================================================

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Record Gitleaks result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            sed -i 's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i 's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # DENO
      # ==========================================================

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Run Deno dependency audit
        id: deno-audit
        continue-on-error: true
        shell: bash
        run: |
          set +e

          deno audit > security-baseline/deno-audit.txt 2>&1

          STATUS=$?

          echo "$STATUS" > security-baseline/deno-audit.exit

          cat security-baseline/deno-audit.txt

          exit "$STATUS"

      - name: Record Deno audit result
        if: always()
        shell: bash
        run: |
          STATUS="$(
            cat security-baseline/deno-audit.exit 2>/dev/null || echo 1
          )"

          if [ "$STATUS" = "0" ]; then
            sed -i 's/^DENO_STATUS=.*/DENO_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i 's/^DENO_STATUS=.*/DENO_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # CODEQL
      # ==========================================================

      - name: Initialize CodeQL
        id: codeql-init
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        id: codeql-analyze
        if: always() && steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Record CodeQL result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.codeql-init.outcome }}" = "success" ] &&
             [ "${{ steps.codeql-analyze.outcome }}" = "success" ]; then

            sed -i 's/^CODEQL_STATUS=.*/CODEQL_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i 's/^CODEQL_STATUS=.*/CODEQL_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

      # ==========================================================
      # ZAP TARGET CONNECTIVITY
      # ==========================================================

      - name: Verify ZAP target
        id: zap-target
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            echo "SECURITY_TARGET_URL is not configured."
            exit 1
          fi

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$SECURITY_TARGET_URL"
          )"

          CURL_STATUS=$?

          echo "ZAP target HTTP status: $HTTP_STATUS"
          echo "curl exit code: $CURL_STATUS"

          if [ "$CURL_STATUS" -eq 0 ] &&
             [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then
            exit 0
          fi

          exit 1

      # ==========================================================
      # OWASP ZAP BASELINE
      # ==========================================================

      - name: OWASP ZAP Baseline Scan
        id: zap
        if: always() && steps.zap-target.outcome == 'success'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.SECURITY_TARGET_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Record ZAP result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.zap-target.outcome }}" = "success" ] &&
             [ "${{ steps.zap.outcome }}" = "success" ]; then

            sed -i 's/^ZAP_STATUS=.*/ZAP_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i 's/^ZAP_STATUS=.*/ZAP_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

           # ==========================================================
      # API SECURITY PROFILE
      # ==========================================================

      - name: API security profile
        id: api-profile
        if: always() && steps.target.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SECURITY_TARGET_URL: ${{ secrets.SECURITY_TARGET_URL }}
          SECURITY_PROTECTED_PATH: ${{ secrets.SECURITY_PROTECTED_PATH }}
          SECURITY_TEST_EMAIL: ${{ secrets.SECURITY_TEST_EMAIL }}
          SECURITY_TEST_PASSWORD: ${{ secrets.SECURITY_TEST_PASSWORD }}
        run: |
          set +e

          BASE_URL="${SECURITY_TARGET_URL%/}"

          HEALTH_URL="${BASE_URL}/api/v1/health"
          LOGIN_URL="${BASE_URL}/api/v1/auth/login"
          ME_URL="${BASE_URL}/api/v1/auth/me"
          PROTECTED_URL="${BASE_URL}/${SECURITY_PROTECTED_PATH#/}"

          mkdir -p security-baseline

          echo "=============================================================="
          echo "API SECURITY PROFILE"
          echo "=============================================================="
          echo "Health:    $HEALTH_URL"
          echo "Login:     $LOGIN_URL"
          echo "Me:        $ME_URL"
          echo "Protected: $PROTECTED_URL"
          echo "=============================================================="

          # --------------------------------------------------------
          # Initialize results
          # --------------------------------------------------------

          HEALTH_STATUS="N/A"
          HEALTH_RESULT="NOT RUN"

          AUTH_ME_NO_TOKEN_STATUS="N/A"
          AUTH_ME_NO_TOKEN_RESULT="NOT RUN"

          LOGIN_STATUS="N/A"
          LOGIN_RESULT="NOT RUN"

          AUTH_ME_STATUS="N/A"
          AUTH_ME_RESULT="NOT RUN"

          PROTECTED_NO_AUTH_STATUS="N/A"
          PROTECTED_NO_AUTH_RESULT="NOT RUN"

          PROTECTED_AUTH_STATUS="N/A"
          PROTECTED_AUTH_RESULT="NOT RUN"

          INVALID_TOKEN_STATUS="N/A"
          INVALID_TOKEN_RESULT="NOT RUN"

          HEADER_RESULT="NOT RUN"
          CORS_RESULT="NOT RUN"

          API_RESULT="REVIEW"

          # --------------------------------------------------------
          # 1. PUBLIC HEALTH ENDPOINT
          # --------------------------------------------------------

          echo ""
          echo "[1/8] Public health endpoint"

          HEALTH_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/health-body.txt \
              --dump-header security-baseline/health-headers.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$HEALTH_URL"
          )"

          HEALTH_CURL_STATUS=$?

          echo "HTTP status: $HEALTH_STATUS"

          if [ "$HEALTH_CURL_STATUS" -eq 0 ] &&
             [ "$HEALTH_STATUS" = "200" ]; then

            HEALTH_RESULT="PASS"

          else

            HEALTH_RESULT="FAIL"

          fi

          # --------------------------------------------------------
          # 2. /auth/me WITHOUT TOKEN
          # --------------------------------------------------------

          echo ""
          echo "[2/8] /auth/me without authentication"

          AUTH_ME_NO_TOKEN_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/auth-me-no-token-body.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$ME_URL"
          )"

          AUTH_ME_NO_TOKEN_CURL_STATUS=$?

          echo "HTTP status: $AUTH_ME_NO_TOKEN_STATUS"

          if [ "$AUTH_ME_NO_TOKEN_CURL_STATUS" -eq 0 ] &&
             [ "$AUTH_ME_NO_TOKEN_STATUS" = "401" ]; then

            AUTH_ME_NO_TOKEN_RESULT="PASS"

          elif [ "$AUTH_ME_NO_TOKEN_STATUS" = "403" ]; then

            AUTH_ME_NO_TOKEN_RESULT="PASS"

          else

            AUTH_ME_NO_TOKEN_RESULT="FAIL"

          fi

          # --------------------------------------------------------
          # 3. LOGIN
          # --------------------------------------------------------

          echo ""
          echo "[3/8] Authentication login"

          if [ -z "${SECURITY_TEST_EMAIL:-}" ] ||
             [ -z "${SECURITY_TEST_PASSWORD:-}" ]; then

            LOGIN_RESULT="NOT CONFIGURED"
            AUTH_ME_RESULT="NOT VERIFIED"
            PROTECTED_AUTH_RESULT="NOT VERIFIED"

          else

            LOGIN_RESPONSE="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output security-baseline/login-response.json \
                --write-out "%{http_code}" \
                --max-time 20 \
                -H "Content-Type: application/json" \
                -X POST \
                --data "$(jq -n \
                  --arg email "$SECURITY_TEST_EMAIL" \
                  --arg password "$SECURITY_TEST_PASSWORD" \
                  '{email: $email, password: $password}')" \
                "$LOGIN_URL"
            )"

            LOGIN_CURL_STATUS=$?

            LOGIN_STATUS="$LOGIN_RESPONSE"

            echo "Login HTTP status: $LOGIN_STATUS"

            if [ "$LOGIN_CURL_STATUS" -eq 0 ] &&
               [ "$LOGIN_STATUS" = "200" ]; then

              LOGIN_RESULT="PASS"

              ACCESS_TOKEN="$(
                jq -r '.data.accessToken // empty' \
                  security-baseline/login-response.json
              )"

              if [ -z "$ACCESS_TOKEN" ]; then
                LOGIN_RESULT="FAIL"
                AUTH_ME_RESULT="NOT VERIFIED"
                PROTECTED_AUTH_RESULT="NOT VERIFIED"
              fi

            elif [ "$LOGIN_STATUS" = "401" ]; then

              LOGIN_RESULT="FAIL"
              AUTH_ME_RESULT="NOT VERIFIED"
              PROTECTED_AUTH_RESULT="NOT VERIFIED"

            else

              LOGIN_RESULT="REVIEW"
              AUTH_ME_RESULT="NOT VERIFIED"
              PROTECTED_AUTH_RESULT="NOT VERIFIED"

            fi

          fi

          # --------------------------------------------------------
          # 4. /auth/me WITH VALID TOKEN
          # --------------------------------------------------------

          echo ""
          echo "[4/8] /auth/me with authentication"

          if [ -n "${ACCESS_TOKEN:-}" ]; then

            AUTH_ME_STATUS="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output security-baseline/auth-me-body.txt \
                --write-out "%{http_code}" \
                --max-time 20 \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                "$ME_URL"
            )"

            AUTH_ME_CURL_STATUS=$?

            echo "HTTP status: $AUTH_ME_STATUS"

            if [ "$AUTH_ME_CURL_STATUS" -eq 0 ] &&
               [ "$AUTH_ME_STATUS" = "200" ]; then

              AUTH_ME_RESULT="PASS"

            else

              AUTH_ME_RESULT="FAIL"

            fi

          else

            AUTH_ME_RESULT="NOT VERIFIED"

          fi

          # --------------------------------------------------------
          # 5. PROTECTED ROUTE WITHOUT TOKEN
          # --------------------------------------------------------

          echo ""
          echo "[5/8] Protected route without authentication"

          PROTECTED_NO_AUTH_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/protected-no-auth-body.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$PROTECTED_URL"
          )"

          PROTECTED_NO_AUTH_CURL_STATUS=$?

          echo "HTTP status: $PROTECTED_NO_AUTH_STATUS"

          if [ "$PROTECTED_NO_AUTH_CURL_STATUS" -ne 0 ]; then

            PROTECTED_NO_AUTH_RESULT="REVIEW"

          else

            case "$PROTECTED_NO_AUTH_STATUS" in

              401|403)
                PROTECTED_NO_AUTH_RESULT="PASS"
                ;;

              404)
                PROTECTED_NO_AUTH_RESULT="NOT VERIFIED"
                ;;

              200|201|202|204|301|302|307|308)
                PROTECTED_NO_AUTH_RESULT="FAIL"
                ;;

              *)
                PROTECTED_NO_AUTH_RESULT="REVIEW"
                ;;

            esac

          fi

          # --------------------------------------------------------
          # 6. PROTECTED ROUTE WITH VALID TOKEN
          # --------------------------------------------------------

          echo ""
          echo "[6/8] Protected route with authentication"

          if [ -n "${ACCESS_TOKEN:-}" ]; then

            PROTECTED_AUTH_STATUS="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output security-baseline/protected-auth-body.txt \
                --write-out "%{http_code}" \
                --max-time 20 \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                "$PROTECTED_URL"
            )"

            PROTECTED_AUTH_CURL_STATUS=$?

            echo "HTTP status: $PROTECTED_AUTH_STATUS"

            if [ "$PROTECTED_AUTH_CURL_STATUS" -ne 0 ]; then

              PROTECTED_AUTH_RESULT="REVIEW"

            else

              case "$PROTECTED_AUTH_STATUS" in

                200|201|202|204)
                  PROTECTED_AUTH_RESULT="PASS"
                  ;;

                401)
                  PROTECTED_AUTH_RESULT="FAIL"
                  ;;

                403)
                  PROTECTED_AUTH_RESULT="REVIEW"
                  ;;

                404)
                  PROTECTED_AUTH_RESULT="NOT VERIFIED"
                  ;;

                *)
                  PROTECTED_AUTH_RESULT="REVIEW"
                  ;;

              esac

            fi

          else

            PROTECTED_AUTH_RESULT="NOT VERIFIED"

          fi

          # --------------------------------------------------------
          # 7. INVALID TOKEN
          # --------------------------------------------------------

          echo ""
          echo "[7/8] Invalid bearer token"

          INVALID_TOKEN_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/invalid-token-body.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              -H "Authorization: Bearer invalid-security-baseline-token" \
              "$ME_URL"
          )"

          INVALID_TOKEN_CURL_STATUS=$?

          echo "HTTP status: $INVALID_TOKEN_STATUS"

          if [ "$INVALID_TOKEN_CURL_STATUS" -eq 0 ] &&
             [ "$INVALID_TOKEN_STATUS" = "401" ]; then

            INVALID_TOKEN_RESULT="PASS"

          elif [ "$INVALID_TOKEN_STATUS" = "403" ]; then

            INVALID_TOKEN_RESULT="PASS"

          else

            INVALID_TOKEN_RESULT="FAIL"

          fi

          # --------------------------------------------------------
          # 8. SECURITY HEADERS
          # --------------------------------------------------------

          echo ""
          echo "[8/8] Security headers"

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/security-headers.txt \
            --output /dev/null \
            --max-time 20 \
            "$HEALTH_URL"

          HEADER_CURL_STATUS=$?

          if [ "$HEADER_CURL_STATUS" -ne 0 ]; then

            HEADER_RESULT="REVIEW"

          else

            HSTS="ABSENT"
            XCTO="ABSENT"

            if grep -qi '^strict-transport-security:' \
              security-baseline/security-headers.txt; then
              HSTS="PRESENT"
            fi

            if grep -qi '^x-content-type-options:' \
              security-baseline/security-headers.txt; then
              XCTO="PRESENT"
            fi

            if [ "$HSTS" = "PRESENT" ] &&
               [ "$XCTO" = "PRESENT" ]; then

              HEADER_RESULT="PASS"

            else

              HEADER_RESULT="OBSERVED"

            fi

          fi

          # --------------------------------------------------------
          # CORS
          # --------------------------------------------------------

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/cors-headers.txt \
            --output /dev/null \
            --max-time 20 \
            -H "Origin: https://security-baseline-invalid.example" \
            "$HEALTH_URL"

          CORS_CURL_STATUS=$?

          if [ "$CORS_CURL_STATUS" -ne 0 ]; then

            CORS_RESULT="REVIEW"

          elif grep -qi \
            '^access-control-allow-origin: https://security-baseline-invalid.example' \
            security-baseline/cors-headers.txt; then

            CORS_RESULT="REVIEW"

          elif grep -qi \
            '^access-control-allow-origin: \*' \
            security-baseline/cors-headers.txt; then

            CORS_RESULT="REVIEW"

          else

            CORS_RESULT="OBSERVED"

          fi

          # --------------------------------------------------------
          # OVERALL API SECURITY RESULT
          # --------------------------------------------------------

          if [ "$HEALTH_RESULT" = "FAIL" ] ||
            [ "$AUTH_ME_NO_TOKEN_RESULT" = "FAIL" ] ||
            [ "$LOGIN_RESULT" = "FAIL" ] ||
            [ "$AUTH_ME_RESULT" = "FAIL" ] ||
            [ "$PROTECTED_NO_AUTH_RESULT" = "FAIL" ] ||
            [ "$PROTECTED_AUTH_RESULT" = "FAIL" ] ||
            [ "$INVALID_TOKEN_RESULT" = "FAIL" ]; then

            API_RESULT="FAIL"

          elif [ "$CORS_RESULT" = "REVIEW" ]; then

            API_RESULT="REVIEW"

          elif [ "$HEALTH_RESULT" = "PASS" ] &&
              [ "$AUTH_ME_NO_TOKEN_RESULT" = "PASS" ] &&
              [ "$LOGIN_RESULT" = "PASS" ] &&
              [ "$AUTH_ME_RESULT" = "PASS" ] &&
              [ "$PROTECTED_NO_AUTH_RESULT" = "PASS" ] &&
              [ "$PROTECTED_AUTH_RESULT" = "PASS" ] &&
              [ "$INVALID_TOKEN_RESULT" = "PASS" ]; then

            API_RESULT="PASS"

          else

            API_RESULT="REVIEW"

          fi

          # --------------------------------------------------------
          # SAVE MACHINE-READABLE RESULTS
          # --------------------------------------------------------

          cat > security-baseline/api-results.env <<EOF
          HEALTH_STATUS=$HEALTH_STATUS
          HEALTH_RESULT=$HEALTH_RESULT
          AUTH_ME_NO_TOKEN_STATUS=$AUTH_ME_NO_TOKEN_STATUS
          AUTH_ME_NO_TOKEN_RESULT=$AUTH_ME_NO_TOKEN_RESULT
          LOGIN_STATUS=$LOGIN_STATUS
          LOGIN_RESULT=$LOGIN_RESULT
          AUTH_ME_STATUS=$AUTH_ME_STATUS
          AUTH_ME_RESULT=$AUTH_ME_RESULT
          PROTECTED_NO_AUTH_STATUS=$PROTECTED_NO_AUTH_STATUS
          PROTECTED_NO_AUTH_RESULT=$PROTECTED_NO_AUTH_RESULT
          PROTECTED_AUTH_STATUS=$PROTECTED_AUTH_STATUS
          PROTECTED_AUTH_RESULT=$PROTECTED_AUTH_RESULT
          INVALID_TOKEN_STATUS=$INVALID_TOKEN_STATUS
          INVALID_TOKEN_RESULT=$INVALID_TOKEN_RESULT
          HEADER_RESULT=$HEADER_RESULT
          CORS_RESULT=$CORS_RESULT
          API_RESULT=$API_RESULT
          EOF

          sed -i "s/^API_STATUS=.*/API_STATUS=$API_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_HEALTH_STATUS=.*/API_HEALTH_STATUS=$HEALTH_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_AUTH_STATUS=.*/API_AUTH_STATUS=$AUTH_ME_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_HEADERS_STATUS=.*/API_HEADERS_STATUS=$HEADER_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_CORS_STATUS=.*/API_CORS_STATUS=$CORS_RESULT/" \
            security-baseline/results.env

          # --------------------------------------------------------
          # GITHUB STEP SUMMARY
          # --------------------------------------------------------

          {
            echo ""
            echo "## API Security Profile"
            echo ""
            echo "| Security Control | HTTP | Result |"
            echo "|---|---:|---|"
            echo "| Public health endpoint | $HEALTH_STATUS | $HEALTH_RESULT |"
            echo "| /auth/me without token | $AUTH_ME_NO_TOKEN_STATUS | $AUTH_ME_NO_TOKEN_RESULT |"
            echo "| Login with test credentials | $LOGIN_STATUS | $LOGIN_RESULT |"
            echo "| /auth/me with valid token | $AUTH_ME_STATUS | $AUTH_ME_RESULT |"
            echo "| Protected route without token | $PROTECTED_NO_AUTH_STATUS | $PROTECTED_NO_AUTH_RESULT |"
            echo "| Protected route with valid token | $PROTECTED_AUTH_STATUS | $PROTECTED_AUTH_RESULT |"
            echo "| Invalid bearer token | $INVALID_TOKEN_STATUS | $INVALID_TOKEN_RESULT |"
            echo "| Security headers | — | $HEADER_RESULT |"
            echo "| CORS | — | $CORS_RESULT |"
            echo ""
            echo "### Endpoint Configuration"
            echo ""
            echo "| Endpoint | Path |"
            echo "|---|---|"
            echo "| Health | /api/v1/health |"
            echo "| Login | /api/v1/auth/login |"
            echo "| Current user | /api/v1/auth/me |"
            echo "| Protected test route | ${SECURITY_PROTECTED_PATH:-NOT CONFIGURED} |"
            echo ""
            echo "### Interpretation"
            echo ""
            echo "- Public health endpoint should return HTTP 200."
            echo "- Unauthenticated /auth/me should return HTTP 401."
            echo "- Valid test credentials should authenticate successfully."
            echo "- Authenticated /auth/me should return HTTP 200."
            echo "- Protected endpoint without a token should return HTTP 401/403."
            echo "- Protected endpoint with a valid token should return an authorized response."
            echo "- Invalid bearer tokens should be rejected with HTTP 401."
            echo "- CORS is reported as an observation rather than a complete CORS assessment."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # --------------------------------------------------------
          # CONSOLE OUTPUT
          # --------------------------------------------------------

          echo ""
          echo "=============================================================="
          echo "API SECURITY PROFILE"
          echo "=============================================================="
          printf '%-38s %-10s %-18s\n' "CONTROL" "HTTP" "RESULT"
          echo "--------------------------------------------------------------"
          printf '%-38s %-10s %-18s\n' \
            "Public health endpoint" \
            "$HEALTH_STATUS" \
            "$HEALTH_RESULT"
          printf '%-38s %-10s %-18s\n' \
            "/auth/me without token" \
            "$AUTH_ME_NO_TOKEN_STATUS" \
            "$AUTH_ME_NO_TOKEN_RESULT"
          printf '%-38s %-10s %-18s\n' \
            "Login" \
            "$LOGIN_STATUS" \
            "$LOGIN_RESULT"
