name: Security Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest

    env:
      SECURITY_TARGET_URL: ${{ secrets.SECURITY_TARGET_URL }}
      SECURITY_HEALTH_PATH: ${{ secrets.SECURITY_HEALTH_PATH }}
      SECURITY_PROTECTED_PATH: ${{ secrets.SECURITY_PROTECTED_PATH }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================================
      # INITIALIZE
      # ==========================================================

      - name: Initialize security baseline
        shell: bash
        run: |
          set -u

          mkdir -p security-baseline

          cat > security-baseline/results.env <<'EOF'
          TARGET_STATUS=NOT_RUN
          GITLEAKS_STATUS=NOT_RUN
          DENO_STATUS=NOT_RUN
          CODEQL_STATUS=NOT_RUN
          ZAP_STATUS=NOT_RUN
          API_STATUS=NOT_RUN
          API_HEALTH_STATUS=NOT_RUN
          API_AUTH_STATUS=NOT_RUN
          API_HEADERS_STATUS=NOT_RUN
          API_CORS_STATUS=NOT_RUN
          EOF

          echo "Security baseline initialized."

      # ==========================================================
      # TARGET CONNECTIVITY
      # ==========================================================

      - name: Verify security target
        id: target
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            echo "SECURITY_TARGET_URL is not configured."
            sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
              security-baseline/results.env
            exit 1
          fi

          echo "Checking security target:"
          echo "$SECURITY_TARGET_URL"

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/target-body.txt \
              --dump-header security-baseline/target-headers.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$SECURITY_TARGET_URL"
          )"

          echo "Target HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then

            sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=PASS/' \
              security-baseline/results.env

            exit 0
          fi

          sed -i 's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
            security-baseline/results.env

          exit 1

      # ==========================================================
      # GITLEAKS
      # ==========================================================

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Record Gitleaks result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            sed -i 's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i 's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # DENO
      # ==========================================================

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Install dependencies from lockfile
        id: deno-install
        continue-on-error: true
        shell: bash
        run: |
          set +e

          deno ci > security-baseline/deno-ci.txt 2>&1
          STATUS=$?

          cat security-baseline/deno-ci.txt

          exit "$STATUS"

      - name: Run Deno dependency audit
        id: deno-audit
        continue-on-error: true
        shell: bash
        run: |
          set +e

          deno audit > security-baseline/deno-audit.txt 2>&1
          STATUS=$?

          printf '%s\n' "$STATUS" \
            > security-baseline/deno-audit.exit

          cat security-baseline/deno-audit.txt

          exit "$STATUS"

      - name: Record Deno audit result
        if: always()
        shell: bash
        run: |
          STATUS="$(
            cat security-baseline/deno-audit.exit \
              2>/dev/null || echo 1
          )"

          if [ "$STATUS" = "0" ]; then
            sed -i 's/^DENO_STATUS=.*/DENO_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i 's/^DENO_STATUS=.*/DENO_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # CODEQL
      # ==========================================================

      - name: Initialize CodeQL
        id: codeql-init
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        id: codeql-analyze
        if: always() && steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Record CodeQL result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.codeql-init.outcome }}" = "success" ] &&
             [ "${{ steps.codeql-analyze.outcome }}" = "success" ]; then

            sed -i 's/^CODEQL_STATUS=.*/CODEQL_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i 's/^CODEQL_STATUS=.*/CODEQL_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

      # ==========================================================
      # ZAP TARGET
      # ==========================================================

      - name: Verify ZAP target
        id: zap-target
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            exit 1
          fi

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$SECURITY_TARGET_URL"
          )"

          echo "ZAP target HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then
            exit 0
          fi

          exit 1

      # ==========================================================
      # OWASP ZAP BASELINE
      # ==========================================================

      - name: OWASP ZAP Baseline Scan
        id: zap
        if: always() && steps.zap-target.outcome == 'success'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.SECURITY_TARGET_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Record ZAP result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.zap-target.outcome }}" = "success" ] &&
             [ "${{ steps.zap.outcome }}" = "success" ]; then

            sed -i 's/^ZAP_STATUS=.*/ZAP_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i 's/^ZAP_STATUS=.*/ZAP_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

      # ==========================================================
      # API SECURITY CONTROL PROBES
      # ==========================================================

      - name: API security control probes
        id: api-probes
        if: always() && steps.target.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          BASE_URL="${SECURITY_TARGET_URL%/}"

          echo "=============================================================="
          echo "API SECURITY CONTROL PROBES"
          echo "=============================================================="
          echo ""

          # ------------------------------------------------------
          # Validate configuration
          # ------------------------------------------------------

          if [ -z "${SECURITY_HEALTH_PATH:-}" ]; then
            HEALTH_RESULT="NOT CONFIGURED"
            HEALTH_STATUS="N/A"
          else
            HEALTH_PATH="/${SECURITY_HEALTH_PATH#/}"
            HEALTH_URL="${BASE_URL}${HEALTH_PATH}"

            echo "Health endpoint:"
            echo "$HEALTH_URL"
            echo ""

            HEALTH_STATUS="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output security-baseline/health-body.txt \
                --write-out "%{http_code}" \
                --max-time 20 \
                "$HEALTH_URL"
            )"

            echo "Health HTTP status: $HEALTH_STATUS"

            if [ "$HEALTH_STATUS" -ge 200 ] &&
               [ "$HEALTH_STATUS" -lt 400 ]; then
              HEALTH_RESULT="PASS"
            else
              HEALTH_RESULT="REVIEW"
            fi
          fi

          # ------------------------------------------------------
          # Protected endpoint without authentication
          # ------------------------------------------------------

          if [ -z "${SECURITY_PROTECTED_PATH:-}" ]; then

            PROTECTED_STATUS="N/A"
            AUTH_RESULT="NOT CONFIGURED"

          else

            PROTECTED_PATH="/${SECURITY_PROTECTED_PATH#/}"
            PROTECTED_URL="${BASE_URL}${PROTECTED_PATH}"

            echo ""
            echo "Protected endpoint:"
            echo "$PROTECTED_URL"

            PROTECTED_STATUS="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output security-baseline/protected-body.txt \
                --write-out "%{http_code}" \
                --max-time 20 \
                "$PROTECTED_URL"
            )"

            echo "Protected HTTP status: $PROTECTED_STATUS"

            case "$PROTECTED_STATUS" in
              401|403)
                AUTH_RESULT="PASS"
                ;;
              404)
                AUTH_RESULT="NOT VERIFIED"
                ;;
              200|201|202|204|301|302|307|308)
                AUTH_RESULT="FAIL"
                ;;
              *)
                AUTH_RESULT="REVIEW"
                ;;
            esac

          fi

          # ------------------------------------------------------
          # Security headers
          # ------------------------------------------------------

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/security-headers.txt \
            --output /dev/null \
            --max-time 20 \
            "$BASE_URL"

          HEADER_FILE="security-baseline/security-headers.txt"

          HEADER_FINDINGS=""

          if ! grep -qi '^strict-transport-security:' "$HEADER_FILE"; then
            HEADER_FINDINGS="${HEADER_FINDINGS} HSTS"
          fi

          if ! grep -qi '^x-content-type-options:' "$HEADER_FILE"; then
            HEADER_FINDINGS="${HEADER_FINDINGS} X-Content-Type-Options"
          fi

          if ! grep -qi '^content-security-policy:' "$HEADER_FILE"; then
            HEADER_FINDINGS="${HEADER_FINDINGS} CSP"
          fi

          if [ -z "$HEADER_FINDINGS" ]; then
            HEADER_RESULT="PASS"
          else
            HEADER_RESULT="REVIEW"
          fi

          # ------------------------------------------------------
          # CORS
          # ------------------------------------------------------

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/cors-headers.txt \
            --output /dev/null \
            --max-time 20 \
            -H "Origin: https://security-baseline-invalid.example" \
            "$BASE_URL"

          if grep -qi \
            '^access-control-allow-origin: https://security-baseline-invalid.example' \
            security-baseline/cors-headers.txt; then

            CORS_RESULT="REVIEW"

          elif grep -qi \
            '^access-control-allow-origin: \*' \
            security-baseline/cors-headers.txt; then

            CORS_RESULT="REVIEW"

          else

            CORS_RESULT="OBSERVED"

          fi

          printf 'HEALTH_STATUS=%s\n' "$HEALTH_STATUS" \
            > security-baseline/api-results.env

          printf 'HEALTH_RESULT=%s\n' "$HEALTH_RESULT" \
            >> security-baseline/api-results.env

          printf 'PROTECTED_STATUS=%s\n' "$PROTECTED_STATUS" \
            >> security-baseline/api-results.env

          printf 'AUTH_RESULT=%s\n' "$AUTH_RESULT" \
            >> security-baseline/api-results.env

          printf 'HEADER_RESULT=%s\n' "$HEADER_RESULT" \
            >> security-baseline/api-results.env

          printf 'CORS_RESULT=%s\n' "$CORS_RESULT" \
            >> security-baseline/api-results.env

          # ------------------------------------------------------
          # API overall result
          # ------------------------------------------------------

          if [ "$HEALTH_RESULT" = "PASS" ] &&
             [ "$AUTH_RESULT" = "PASS" ] &&
             [ "$HEADER_RESULT" = "PASS" ]; then

            API_RESULT="PASS"

          elif [ "$AUTH_RESULT" = "NOT VERIFIED" ] ||
               [ "$AUTH_RESULT" = "NOT CONFIGURED" ]; then

            API_RESULT="NOT VERIFIED"

          else

            API_RESULT="REVIEW"

          fi

          sed -i "s/^API_STATUS=.*/API_STATUS=$API_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_HEALTH_STATUS=.*/API_HEALTH_STATUS=$HEALTH_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_AUTH_STATUS=.*/API_AUTH_STATUS=$AUTH_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_HEADERS_STATUS=.*/API_HEADERS_STATUS=$HEADER_RESULT/" \
            security-baseline/results.env

          sed -i "s/^API_CORS_STATUS=.*/API_CORS_STATUS=$CORS_RESULT/" \
            security-baseline/results.env

          # ------------------------------------------------------
          # Console dashboard
          # ------------------------------------------------------

          echo ""
          echo "=============================================================="
          echo "API SECURITY CONTROL"
          echo "=============================================================="
          printf '%-34s %-10s %-18s\n' \
            "CONTROL" "HTTP" "RESULT"
          printf '%-34s %-10s %-18s\n' \
            "----------------------------------" \
            "----------" \
            "------------------"

          printf '%-34s %-10s %-18s\n' \
            "Health / public endpoint" \
            "$HEALTH_STATUS" \
            "$HEALTH_RESULT"

          printf '%-34s %-10s %-18s\n' \
            "Protected endpoint / no auth" \
            "$PROTECTED_STATUS" \
            "$AUTH_RESULT"

          printf '%-34s %-10s %-18s\n' \
            "Security headers" \
            "N/A" \
            "$HEADER_RESULT"

          printf '%-34s %-10s %-18s\n' \
            "CORS observation" \
            "N/A" \
            "$CORS_RESULT"

          echo "=============================================================="

      # ==========================================================
      # FINAL CONSOLIDATED DASHBOARD
      # ==========================================================

      - name: Generate security baseline dashboard
        if: always()
        shell: bash
        run: |
          set -u

          # ------------------------------------------------------
          # Read only fixed, machine-safe result values
          # ------------------------------------------------------

          TARGET_STATUS="NOT RUN"
          GITLEAKS_STATUS="NOT RUN"
          DENO_STATUS="NOT RUN"
          CODEQL_STATUS="NOT RUN"
          ZAP_STATUS="NOT RUN"
          API_STATUS="NOT RUN"

          API_HEALTH_STATUS="NOT RUN"
          API_AUTH_STATUS="NOT RUN"
          API_HEADERS_STATUS="NOT RUN"
          API_CORS_STATUS="NOT RUN"

          while IFS='=' read -r KEY VALUE; do
            case "$KEY" in
              TARGET_STATUS) TARGET_STATUS="$VALUE" ;;
              GITLEAKS_STATUS) GITLEAKS_STATUS="$VALUE" ;;
              DENO_STATUS) DENO_STATUS="$VALUE" ;;
              CODEQL_STATUS) CODEQL_STATUS="$VALUE" ;;
              ZAP_STATUS) ZAP_STATUS="$VALUE" ;;
              API_STATUS) API_STATUS="$VALUE" ;;
              API_HEALTH_STATUS) API_HEALTH_STATUS="$VALUE" ;;
              API_AUTH_STATUS) API_AUTH_STATUS="$VALUE" ;;
              API_HEADERS_STATUS) API_HEADERS_STATUS="$VALUE" ;;
              API_CORS_STATUS) API_CORS_STATUS="$VALUE" ;;
            esac
          done < security-baseline/results.env

          HEALTH_STATUS="N/A"
          HEALTH_RESULT="$API_HEALTH_STATUS"

          PROTECTED_STATUS="N/A"
          AUTH_RESULT="$API_AUTH_STATUS"

          if [ -f security-baseline/api-results.env ]; then
            while IFS='=' read -r KEY VALUE; do
              case "$KEY" in
                HEALTH_STATUS) HEALTH_STATUS="$VALUE" ;;
                HEALTH_RESULT) HEALTH_RESULT="$VALUE" ;;
                PROTECTED_STATUS) PROTECTED_STATUS="$VALUE" ;;
                AUTH_RESULT) AUTH_RESULT="$VALUE" ;;
              esac
            done < security-baseline/api-results.env
          fi

          HEADER_RESULT="$API_HEADERS_STATUS"
          CORS_RESULT="$API_CORS_STATUS"

          # ------------------------------------------------------
          # Overall status
          # ------------------------------------------------------

          OVERALL="PASS"

          for STATUS in \
            "$TARGET_STATUS" \
            "$GITLEAKS_STATUS" \
            "$DENO_STATUS" \
            "$CODEQL_STATUS" \
            "$ZAP_STATUS" \
            "$API_STATUS"
          do

            if [ "$STATUS" = "FAIL" ]; then
              OVERALL="FAIL"

            elif [ "$STATUS" = "REVIEW" ] ||
                 [ "$STATUS" = "NOT VERIFIED" ]; then

              if [ "$OVERALL" != "FAIL" ]; then
                OVERALL="REVIEW REQUIRED"
              fi
            fi

          done

          # ------------------------------------------------------
          # GitHub Summary
          # ------------------------------------------------------

          {
            echo "# Security Baseline"
            echo ""
            echo "**Repository:** \`${GITHUB_REPOSITORY}\`"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Run:** \`${GITHUB_RUN_ID}\`"
            echo ""

            echo "## Overall Status"
            echo ""
            echo '```text'
            printf '%-30s %s\n' \
              "SECURITY BASELINE" \
              "$OVERALL"
            echo '```'
            echo ""

            echo "## Control Dashboard"
            echo ""
            echo '```text'

            printf '%-30s %-18s\n' \
              "CONTROL" "STATUS"

            printf '%-30s %-18s\n' \
              "------------------------------" \
              "------------------"

            printf '%-30s %-18s\n' \
              "Target Connectivity" \
              "$TARGET_STATUS"

            printf '%-30s %-18s\n' \
              "Gitleaks" \
              "$GITLEAKS_STATUS"

            printf '%-30s %-18s\n' \
              "Dependency Audit" \
              "$DENO_STATUS"

            printf '%-30s %-18s\n' \
              "CodeQL" \
              "$CODEQL_STATUS"

            printf '%-30s %-18s\n' \
              "OWASP ZAP Baseline" \
              "$ZAP_STATUS"

            printf '%-30s %-18s\n' \
              "API Security Controls" \
              "$API_STATUS"

            echo '```'
            echo ""

            echo "## API Security Controls"
            echo ""
            echo '```text'

            printf '%-34s %-10s %-18s\n' \
              "CONTROL" "HTTP" "RESULT"

            printf '%-34s %-10s %-18s\n' \
              "----------------------------------" \
              "----------" \
              "------------------"

            printf '%-34s %-10s %-18s\n' \
              "Health / public endpoint" \
              "$HEALTH_STATUS" \
              "$HEALTH_RESULT"

            printf '%-34s %-10s %-18s\n' \
              "Protected endpoint / no auth" \
              "$PROTECTED_STATUS" \
              "$AUTH_RESULT"

            printf '%-34s %-10s %-18s\n' \
              "Security headers" \
              "N/A" \
              "$HEADER_RESULT"

            printf '%-34s %-10s %-18s\n' \
              "CORS observation" \
              "N/A" \
              "$CORS_RESULT"

            echo '```'
            echo ""

            echo "## API Configuration"
            echo ""
            echo '```text'

            printf '%-24s %s\n' \
              "Target" \
              "$SECURITY_TARGET_URL"

            printf '%-24s %s\n' \
              "Health path" \
              "${SECURITY_HEALTH_PATH:-NOT CONFIGURED}"

            printf '%-24s %s\n' \
              "Protected path" \
              "${SECURITY_PROTECTED_PATH:-NOT CONFIGURED}"

            echo '```'
            echo ""

            echo "## Dependency Audit"
            echo ""

            if [ "$DENO_STATUS" = "PASS" ]; then

              echo "**Status:** PASS"
              echo ""
              echo "No known dependency vulnerabilities were reported."

            else

              echo "**Status:** REVIEW REQUIRED"
              echo ""
              echo '```text'

              cat security-baseline/deno-audit.txt \
                2>/dev/null \
                || echo "No audit output available."

              echo '```'

            fi

            echo ""

            echo "## API Interpretation"
            echo ""

            case "$AUTH_RESULT" in

              PASS)
                echo "- The protected endpoint rejected unauthenticated access."
                echo "- HTTP 401/403 is treated as evidence that authentication enforcement is present."
                ;;

              NOT VERIFIED)
                echo "- The configured protected endpoint returned HTTP 404."
                echo "- Authentication protection could not be verified for that route."
                ;;

              FAIL)
                echo "- The protected endpoint returned a response consistent with unauthenticated access."
                echo "- Authentication enforcement requires review."
                ;;

              NOT CONFIGURED)
                echo "- No protected endpoint path is configured."
                ;;

              *)
                echo "- Authentication control requires review."
                ;;

            esac

            echo ""

            echo "## Security Headers"
            echo ""
            echo '```text'

            cat security-baseline/security-headers.txt \
              2>/dev/null \
              || echo "No security header response available."

            echo '```'
            echo ""

            echo "## Scope"
            echo ""
            echo "This workflow provides a security baseline through:"
            echo ""
            echo "- Secret scanning"
            echo "- Dependency auditing"
            echo "- Static analysis"
            echo "- Passive web security scanning"
            echo "- API authentication control probing"
            echo "- Security header observation"
            echo "- CORS observation"
            echo ""
            echo "This is a baseline characterization and is not a penetration test."
            echo ""
            echo "A REVIEW or NOT VERIFIED result requires interpretation and does not by itself establish a vulnerability."
            echo ""

          } >> "$GITHUB_STEP_SUMMARY"

          # ------------------------------------------------------
          # Console dashboard
          # ------------------------------------------------------

          echo ""
          echo "=============================================================="
          echo "                    SECURITY BASELINE"
          echo "=============================================================="

          printf '%-30s %s\n' \
            "OVERALL STATUS:" \
            "$OVERALL"

          echo "--------------------------------------------------------------"

          printf '%-30s %s\n' \
            "Target Connectivity" \
            "$TARGET_STATUS"

          printf '%-30s %s\n' \
            "Gitleaks" \
            "$GITLEAKS_STATUS"

          printf '%-30s %s\n' \
            "Dependency Audit" \
            "$DENO_STATUS"

          printf '%-30s %s\n' \
            "CodeQL" \
            "$CODEQL_STATUS"

          printf '%-30s %s\n' \
            "OWASP ZAP" \
            "$ZAP_STATUS"

          printf '%-30s %s\n' \
            "API Security" \
            "$API_STATUS"

          echo "=============================================================="

          echo ""
          echo "API SECURITY CONTROL"
          echo "=============================================================="

          printf '%-34s %-10s %-18s\n' \
            "CONTROL" "HTTP" "RESULT"

          printf '%-34s %-10s %-18s\n' \
            "----------------------------------" \
            "----------" \
            "------------------"

          printf '%-34s %-10s %-18s\n' \
            "Health / public endpoint" \
            "$HEALTH_STATUS" \
            "$HEALTH_RESULT"

          printf '%-34s %-10s %-18s\n' \
            "Protected endpoint / no auth" \
            "$PROTECTED_STATUS" \
            "$AUTH_RESULT"

          printf '%-34s %-10s %-18s\n' \
            "Security headers" \
            "N/A" \
            "$HEADER_RESULT"

          printf '%-34s %-10s %-18s\n' \
            "CORS observation" \
            "N/A" \
            "$CORS_RESULT"

          echo "=============================================================="

      # ==========================================================
      # UPLOAD ARTIFACTS
      # ==========================================================

      - name: Upload security baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline-${{ github.run_id }}
          path: security-baseline/
          if-no-files-found: warn
