name: Security Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest

    env:
      SECURITY_TARGET_URL: ${{ secrets.SECURITY_TARGET_URL }}
      SECURITY_HEALTH_PATH: ${{ secrets.SECURITY_HEALTH_PATH }}
      SECURITY_PROTECTED_PATH: ${{ secrets.SECURITY_PROTECTED_PATH }}

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================================
      # INITIALIZE
      # ==========================================================

      - name: Initialize security baseline
        shell: bash
        run: |
          mkdir -p security-baseline

          cat > security-baseline/results.env <<'EOF'
          TARGET_STATUS=NOT RUN
          GITLEAKS_STATUS=NOT RUN
          DENO_STATUS=NOT RUN
          CODEQL_INIT_STATUS=NOT RUN
          CODEQL_STATUS=NOT RUN
          ZAP_STATUS=NOT RUN
          API_STATUS=NOT RUN
          API_HEALTH_STATUS=NOT RUN
          API_AUTH_STATUS=NOT RUN
          API_HEADERS_STATUS=NOT RUN
          API_CORS_STATUS=NOT RUN
          EOF

      # ==========================================================
      # TARGET CONNECTIVITY
      # ==========================================================

      - name: Verify security target
        id: target
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            echo "SECURITY_TARGET_URL is not configured."

            sed -i \
              's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
              security-baseline/results.env

            exit 1
          fi

          echo "Checking security target..."

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output security-baseline/target-body.txt \
              --dump-header security-baseline/target-headers.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$SECURITY_TARGET_URL"
          )"

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then

            sed -i \
              's/^TARGET_STATUS=.*/TARGET_STATUS=PASS/' \
              security-baseline/results.env

            echo "Target reachable."
            exit 0
          fi

          sed -i \
            's/^TARGET_STATUS=.*/TARGET_STATUS=FAIL/' \
            security-baseline/results.env

          echo "Target is not reachable."
          exit 1

      # ==========================================================
      # GITLEAKS
      # ==========================================================

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Record Gitleaks result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            sed -i \
              's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i \
              's/^GITLEAKS_STATUS=.*/GITLEAKS_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # DENO
      # ==========================================================

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Install dependencies from lockfile
        id: deno-install
        continue-on-error: true
        shell: bash
        run: |
          set +e

          deno ci > security-baseline/deno-ci.txt 2>&1
          STATUS=$?

          cat security-baseline/deno-ci.txt

          echo "$STATUS" > security-baseline/deno-ci.exit

          exit "$STATUS"

      - name: Run Deno dependency audit
        id: deno-audit
        continue-on-error: true
        shell: bash
        run: |
          set +e

          deno audit > security-baseline/deno-audit.txt 2>&1
          STATUS=$?

          echo "$STATUS" > security-baseline/deno-audit.exit

          cat security-baseline/deno-audit.txt

          exit "$STATUS"

      - name: Record Deno audit result
        if: always()
        shell: bash
        run: |
          STATUS="$(
            cat security-baseline/deno-audit.exit 2>/dev/null \
              || echo 1
          )"

          if [ "$STATUS" = "0" ]; then
            sed -i \
              's/^DENO_STATUS=.*/DENO_STATUS=PASS/' \
              security-baseline/results.env
          else
            sed -i \
              's/^DENO_STATUS=.*/DENO_STATUS=REVIEW/' \
              security-baseline/results.env
          fi

      # ==========================================================
      # CODEQL
      # ==========================================================

      - name: Initialize CodeQL
        id: codeql-init
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        id: codeql-analyze
        if: always() && steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Record CodeQL result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.codeql-init.outcome }}" = "success" ] &&
             [ "${{ steps.codeql-analyze.outcome }}" = "success" ]; then

            sed -i \
              's/^CODEQL_INIT_STATUS=.*/CODEQL_INIT_STATUS=PASS/' \
              security-baseline/results.env

            sed -i \
              's/^CODEQL_STATUS=.*/CODEQL_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i \
              's/^CODEQL_INIT_STATUS=.*/CODEQL_INIT_STATUS=REVIEW/' \
              security-baseline/results.env

            sed -i \
              's/^CODEQL_STATUS=.*/CODEQL_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

      # ==========================================================
      # ZAP TARGET CONNECTIVITY
      # ==========================================================

      - name: Verify ZAP target
        id: zap-target
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${SECURITY_TARGET_URL:-}" ]; then
            exit 1
          fi

          HTTP_STATUS="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$SECURITY_TARGET_URL"
          )"

          echo "ZAP target HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] &&
             [ "$HTTP_STATUS" -lt 500 ]; then
            exit 0
          fi

          exit 1

      # ==========================================================
      # OWASP ZAP BASELINE
      # ==========================================================

      - name: OWASP ZAP Baseline Scan
        id: zap
        if: always() && steps.zap-target.outcome == 'success'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.SECURITY_TARGET_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Record ZAP result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.zap-target.outcome }}" = "success" ] &&
             [ "${{ steps.zap.outcome }}" = "success" ]; then

            sed -i \
              's/^ZAP_STATUS=.*/ZAP_STATUS=PASS/' \
              security-baseline/results.env

          else

            sed -i \
              's/^ZAP_STATUS=.*/ZAP_STATUS=REVIEW/' \
              security-baseline/results.env

          fi

      # ==========================================================
      # API SECURITY CONTROL PROBES
      # ==========================================================

      - name: API security control probes
        id: api-probes
        if: always() && steps.target.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          BASE_URL="${SECURITY_TARGET_URL%/}"

          echo "=============================================================="
          echo "API SECURITY CONTROL PROBES"
          echo "=============================================================="

          # ======================================================
          # CONFIGURATION
          # ======================================================

          if [ -z "${SECURITY_HEALTH_PATH:-}" ]; then
            echo "SECURITY_HEALTH_PATH is not configured."
            HEALTH_STATUS="N/A"
            HEALTH_RESULT="NOT CONFIGURED"
          else
            HEALTH_URL="${BASE_URL}/${SECURITY_HEALTH_PATH#/}"

            echo "Health URL: $HEALTH_URL"

            HEALTH_STATUS="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output security-baseline/health-body.txt \
                --dump-header security-baseline/health-headers.txt \
                --write-out "%{http_code}" \
                --max-time 20 \
                "$HEALTH_URL"
            )"

            echo "Health status: $HEALTH_STATUS"

            if [ "$HEALTH_STATUS" = "200" ]; then
              HEALTH_RESULT="PASS"
            else
              HEALTH_RESULT="REVIEW"
            fi
          fi

          # ======================================================
          # PROTECTED ENDPOINT / NO AUTHORIZATION
          # ======================================================

          if [ -z "${SECURITY_PROTECTED_PATH:-}" ]; then

            PROTECTED_STATUS="N/A"
            AUTH_RESULT="NOT CONFIGURED"

          else

            PROTECTED_URL="${BASE_URL}/${SECURITY_PROTECTED_PATH#/}"

            echo "Protected URL: $PROTECTED_URL"

            PROTECTED_STATUS="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output security-baseline/protected-body.txt \
                --dump-header security-baseline/protected-headers.txt \
                --write-out "%{http_code}" \
                --max-time 20 \
                "$PROTECTED_URL"
            )"

            echo "Protected endpoint status: $PROTECTED_STATUS"

            case "$PROTECTED_STATUS" in

              401|403)
                AUTH_RESULT="PASS"
                ;;

              404)
                AUTH_RESULT="NOT VERIFIED"
                ;;

              200|201|202|204|3*)
                AUTH_RESULT="FAIL"
                ;;

              *)
                AUTH_RESULT="REVIEW"
                ;;

            esac

          fi

          # ======================================================
          # SECURITY HEADERS
          #
          # API-oriented checks:
          #
          #   HSTS
          #   X-Content-Type-Options
          #
          # CSP is not required for a JSON API baseline because
          # CSP is primarily a browser/content-rendering control.
          # ======================================================

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/security-headers.txt \
            --output /dev/null \
            --max-time 20 \
            "$BASE_URL"

          HEADER_FILE="security-baseline/security-headers.txt"

          HSTS_STATUS="MISSING"
          CONTENT_TYPE_STATUS="MISSING"

          if grep -qi '^strict-transport-security:' "$HEADER_FILE"; then
            HSTS_STATUS="PRESENT"
          fi

          if grep -qi '^x-content-type-options:' "$HEADER_FILE"; then
            CONTENT_TYPE_STATUS="PRESENT"
          fi

          if [ "$HSTS_STATUS" = "PRESENT" ] &&
             [ "$CONTENT_TYPE_STATUS" = "PRESENT" ]; then
            HEADER_RESULT="PASS"
          else
            HEADER_RESULT="REVIEW"
          fi

          # ======================================================
          # CORS OBSERVATION
          # ======================================================

          curl \
            --location \
            --silent \
            --show-error \
            --dump-header security-baseline/cors-headers.txt \
            --output /dev/null \
            --max-time 20 \
            -H "Origin: https://security-baseline-invalid.example" \
            "$BASE_URL"

          CORS_ALLOW_ORIGIN="$(
            grep -i '^access-control-allow-origin:' \
              security-baseline/cors-headers.txt \
              | tail -n 1 \
              | sed 's/\r$//' \
              || true
          )"

          CORS_ALLOW_CREDENTIALS="$(
            grep -i '^access-control-allow-credentials:' \
              security-baseline/cors-headers.txt \
              | tail -n 1 \
              | sed 's/\r$//' \
              || true
          )"

          if echo "$CORS_ALLOW_ORIGIN" |
             grep -qi \
             'https://security-baseline-invalid\.example'; then

            CORS_RESULT="REVIEW"

          elif echo "$CORS_ALLOW_ORIGIN" |
               grep -qi '^\s*access-control-allow-origin:\s*\*'; then

            CORS_RESULT="OBSERVED: *"

          elif [ -n "$CORS_ALLOW_ORIGIN" ]; then

            CORS_RESULT="OBSERVED"

          else

            CORS_RESULT="NO CORS HEADER"

          fi

          # ======================================================
          # SAVE MACHINE-READABLE RESULTS
          # ======================================================

          cat > security-baseline/api-results.env <<EOF
          HEALTH_STATUS=$HEALTH_STATUS
          HEALTH_RESULT=$HEALTH_RESULT
          PROTECTED_STATUS=$PROTECTED_STATUS
          AUTH_RESULT=$AUTH_RESULT
          HSTS_STATUS=$HSTS_STATUS
          CONTENT_TYPE_STATUS=$CONTENT_TYPE_STATUS
          HEADER_RESULT=$HEADER_RESULT
          CORS_RESULT=$CORS_RESULT
          EOF

          # ======================================================
          # API OVERALL RESULT
          # ======================================================

          if [ "$HEALTH_RESULT" = "PASS" ] &&
             [ "$AUTH_RESULT" = "PASS" ] &&
             [ "$HEADER_RESULT" = "PASS" ]; then

            API_RESULT="PASS"

          elif [ "$AUTH_RESULT" = "NOT VERIFIED" ] ||
               [ "$AUTH_RESULT" = "NOT CONFIGURED" ]; then

            API_RESULT="NOT VERIFIED"

          else

            API_RESULT="REVIEW"

          fi

          sed -i \
            "s/^API_STATUS=.*/API_STATUS=$API_RESULT/" \
            security-baseline/results.env

          sed -i \
            "s/^API_HEALTH_STATUS=.*/API_HEALTH_STATUS=$HEALTH_RESULT/" \
            security-baseline/results.env

          sed -i \
            "s/^API_AUTH_STATUS=.*/API_AUTH_STATUS=$AUTH_RESULT/" \
            security-baseline/results.env

          sed -i \
            "s/^API_HEADERS_STATUS=.*/API_HEADERS_STATUS=$HEADER_RESULT/" \
            security-baseline/results.env

          sed -i \
            "s/^API_CORS_STATUS=.*/API_CORS_STATUS=$CORS_RESULT/" \
            security-baseline/results.env

      # ==========================================================
      # FINAL SECURITY DASHBOARD
      # ==========================================================

      - name: Generate security baseline dashboard
        if: always()
        shell: bash
        run: |
          source security-baseline/results.env

          if [ -f security-baseline/api-results.env ]; then
            source security-baseline/api-results.env
          fi

          # ======================================================
          # OVERALL STATUS
          # ======================================================

          OVERALL="PASS"

          for STATUS in \
            "$TARGET_STATUS" \
            "$GITLEAKS_STATUS" \
            "$DENO_STATUS" \
            "$CODEQL_STATUS" \
            "$ZAP_STATUS" \
            "$API_STATUS"
          do

            if [ "$STATUS" = "FAIL" ]; then

              OVERALL="FAIL"

            elif [ "$STATUS" = "REVIEW" ] ||
                 [ "$STATUS" = "NOT VERIFIED" ]; then

              if [ "$OVERALL" != "FAIL" ]; then
                OVERALL="REVIEW REQUIRED"
              fi

            fi

          done

          # ======================================================
          # DISPLAY HELPERS
          # ======================================================

          status_display() {
            case "$1" in
              PASS)
                echo "PASS"
                ;;
              FAIL)
                echo "FAIL"
                ;;
              REVIEW)
                echo "REVIEW"
                ;;
              "NOT VERIFIED")
                echo "NOT VERIFIED"
                ;;
              "NOT CONFIGURED")
                echo "NOT CONFIGURED"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          TARGET_DISPLAY="$(status_display "$TARGET_STATUS")"
          GITLEAKS_DISPLAY="$(status_display "$GITLEAKS_STATUS")"
          DENO_DISPLAY="$(status_display "$DENO_STATUS")"
          CODEQL_DISPLAY="$(status_display "$CODEQL_STATUS")"
          ZAP_DISPLAY="$(status_display "$ZAP_STATUS")"
          API_DISPLAY="$(status_display "$API_STATUS")"

          # ======================================================
          # GITHUB STEP SUMMARY
          # ======================================================

          {
            echo "# Security Baseline"
            echo ""
            echo "**Repository:** \`${GITHUB_REPOSITORY}\`"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Run:** \`${GITHUB_RUN_ID}\`"
            echo ""
            echo "**Target:** \`${SECURITY_TARGET_URL:-NOT CONFIGURED}\`"
            echo ""

            echo "## Overall Status"
            echo ""
            echo '```text'
            printf '%-30s %s\n' \
              "SECURITY BASELINE" \
              "$OVERALL"
            echo '```'
            echo ""

            echo "## Control Dashboard"
            echo ""
            echo '```text'
            printf '%-30s %-18s\n' \
              "CONTROL" \
              "STATUS"

            printf '%-30s %-18s\n' \
              "------------------------------" \
              "------------------"

            printf '%-30s %-18s\n' \
              "Target Connectivity" \
              "$TARGET_DISPLAY"

            printf '%-30s %-18s\n' \
              "Gitleaks" \
              "$GITLEAKS_DISPLAY"

            printf '%-30s %-18s\n' \
              "Dependency Audit" \
              "$DENO_DISPLAY"

            printf '%-30s %-18s\n' \
              "CodeQL" \
              "$CODEQL_DISPLAY"

            printf '%-30s %-18s\n' \
              "OWASP ZAP Baseline" \
              "$ZAP_DISPLAY"

            printf '%-30s %-18s\n' \
              "API Security Controls" \
              "$API_DISPLAY"

            echo '```'
            echo ""

            # ====================================================
            # API SECURITY
            # ====================================================

            echo "## API Security Controls"
            echo ""
            echo '```text'

            printf '%-34s %-12s %-18s\n' \
              "CONTROL" \
              "HTTP" \
              "RESULT"

            printf '%-34s %-12s %-18s\n' \
              "----------------------------------" \
              "------------" \
              "------------------"

            printf '%-34s %-12s %-18s\n' \
              "Health endpoint" \
              "${HEALTH_STATUS:-N/A}" \
              "${HEALTH_RESULT:-NOT RUN}"

            printf '%-34s %-12s %-18s\n' \
              "Protected endpoint / no auth" \
              "${PROTECTED_STATUS:-N/A}" \
              "${AUTH_RESULT:-NOT RUN}"

            printf '%-34s %-12s %-18s\n' \
              "Security headers" \
              "N/A" \
              "${HEADER_RESULT:-NOT RUN}"

            printf '%-34s %-12s %-18s\n' \
              "CORS observation" \
              "N/A" \
              "${CORS_RESULT:-NOT RUN}"

            echo '```'
            echo ""

            # ====================================================
            # API CONFIGURATION
            # ====================================================

            echo "### API Endpoints Tested"
            echo ""
            echo "| Control | Endpoint |"
            echo "|---|---|"
            echo "| Health | \`${SECURITY_HEALTH_PATH:-NOT CONFIGURED}\` |"
            echo "| Authentication | \`${SECURITY_PROTECTED_PATH:-NOT CONFIGURED}\` |"
            echo ""

            # ====================================================
            # AUTH INTERPRETATION
            # ====================================================

            echo "### Authentication Control"
            echo ""

            case "${AUTH_RESULT:-}" in

              PASS)
                echo "PASS — the protected endpoint rejected the unauthenticated request with HTTP ${PROTECTED_STATUS}."
                ;;

              FAIL)
                echo "FAIL — the protected endpoint accepted an unauthenticated request or returned a redirect response."
                ;;

              "NOT VERIFIED")
                echo "NOT VERIFIED — the configured protected endpoint returned HTTP 404."
                echo "The configured path may not exist in the deployed environment."
                ;;

              "NOT CONFIGURED")
                echo "NOT CONFIGURED — no protected endpoint path was supplied."
                ;;

              *)
                echo "REVIEW — authentication behavior requires manual inspection."
                ;;

            esac

            echo ""

            # ====================================================
            # HEALTH INTERPRETATION
            # ====================================================

            echo "### Health Control"
            echo ""

            if [ "${HEALTH_RESULT:-}" = "PASS" ]; then

              echo "PASS — the configured health endpoint returned HTTP 200."

            elif [ "${HEALTH_RESULT:-}" = "NOT CONFIGURED" ]; then

              echo "NOT CONFIGURED — no health endpoint path was supplied."

            else

              echo "REVIEW — the configured health endpoint returned HTTP ${HEALTH_STATUS:-N/A}."

            fi

            echo ""

            # ====================================================
            # SECURITY HEADERS
            # ====================================================

            echo "### Security Headers"
            echo ""
            echo '```text'

            printf '%-32s %s\n' \
              "Strict-Transport-Security" \
              "${HSTS_STATUS:-NOT CHECKED}"

            printf '%-32s %s\n' \
              "X-Content-Type-Options" \
              "${CONTENT_TYPE_STATUS:-NOT CHECKED}"

            printf '%-32s %s\n' \
              "Content-Security-Policy" \
              "NOT REQUIRED FOR API BASELINE"

            echo '```'
            echo ""

            # ====================================================
            # CORS
            # ====================================================

            echo "### CORS Observation"
            echo ""
            echo "The workflow sends:"
            echo ""
            echo "\`Origin: https://security-baseline-invalid.example\`"
            echo ""

            if [ -n "${CORS_ALLOW_ORIGIN:-}" ]; then
              echo "**Access-Control-Allow-Origin:**"
              echo ""
              echo "\`$CORS_ALLOW_ORIGIN\`"
              echo ""
            else
              echo "No Access-Control-Allow-Origin response header was observed."
              echo ""
            fi

            if [ -n "${CORS_ALLOW_CREDENTIALS:-}" ]; then
              echo "**Access-Control-Allow-Credentials:**"
              echo ""
              echo "\`$CORS_ALLOW_CREDENTIALS\`"
              echo ""
            fi

            echo "CORS is reported as an observation and should be evaluated against the application's intended cross-origin policy."
            echo ""

            # ====================================================
            # DEPENDENCY AUDIT
            # ====================================================

            echo "## Dependency Audit"
            echo ""

            if [ "$DENO_STATUS" = "PASS" ]; then

              echo "**Status:** PASS"
              echo ""
              echo "No known dependency vulnerabilities were reported by \`deno audit\`."

            else

              echo "**Status:** REVIEW REQUIRED"
              echo ""

              echo '```text'

              cat security-baseline/deno-audit.txt 2>/dev/null \
                || echo "No audit output available."

              echo '```'

            fi

            echo ""

            # ====================================================
            # GITLEAKS
            # ====================================================

            echo "## Secret Scanning"
            echo ""
            echo "**Gitleaks:** $GITLEAKS_DISPLAY"
            echo ""

            # ====================================================
            # CODEQL
            # ====================================================

            echo "## Static Analysis"
            echo ""
            echo "**CodeQL:** $CODEQL_DISPLAY"
            echo ""

            # ====================================================
            # ZAP
            # ====================================================

            echo "## Web Security Scan"
            echo ""
            echo "**OWASP ZAP Baseline:** $ZAP_DISPLAY"
            echo ""
            echo "Scan type: passive baseline scan."
            echo ""

            # ====================================================
            # IMPORTANT INTERPRETATION
            # ====================================================

            echo "## Interpretation"
            echo ""
            echo "This workflow provides automated security baseline characterization through:"
            echo ""
            echo "- dependency auditing"
            echo "- secret scanning"
            echo "- static analysis"
            echo "- passive web scanning"
            echo "- API authentication controls"
            echo "- API health monitoring"
            echo "- security-header observation"
            echo "- CORS observation"
            echo ""
            echo "It is not a penetration test and does not establish the absence of security vulnerabilities."
            echo ""

            # ====================================================
            # CONFIGURATION
            # ====================================================

            echo "## Baseline Configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Target | \`${SECURITY_TARGET_URL:-NOT CONFIGURED}\` |"
            echo "| Health path | \`${SECURITY_HEALTH_PATH:-NOT CONFIGURED}\` |"
            echo "| Protected path | \`${SECURITY_PROTECTED_PATH:-NOT CONFIGURED}\` |"
            echo ""

          } >> "$GITHUB_STEP_SUMMARY"

          # ======================================================
          # CONSOLE DASHBOARD
          # ======================================================

          echo ""
          echo "=============================================================="
          echo "                    SECURITY BASELINE"
          echo "=============================================================="

          printf '%-30s %s\n' \
            "OVERALL STATUS:" \
            "$OVERALL"

          echo "--------------------------------------------------------------"

          printf '%-30s %s\n' \
            "Target Connectivity" \
            "$TARGET_DISPLAY"

          printf '%-30s %s\n' \
            "Gitleaks" \
            "$GITLEAKS_DISPLAY"

          printf '%-30s %s\n' \
            "Dependency Audit" \
            "$DENO_DISPLAY"

          printf '%-30s %s\n' \
            "CodeQL" \
            "$CODEQL_DISPLAY"

          printf '%-30s %s\n' \
            "OWASP ZAP" \
            "$ZAP_DISPLAY"

          printf '%-30s %s\n' \
            "API Security" \
            "$API_DISPLAY"

          echo "--------------------------------------------------------------"

          printf '%-34s %-12s %-18s\n' \
            "API CONTROL" \
            "HTTP" \
            "RESULT"

          printf '%-34s %-12s %-18s\n' \
            "----------------------------------" \
            "------------" \
            "------------------"

          printf '%-34s %-12s %-18s\n' \
            "Health endpoint" \
            "${HEALTH_STATUS:-N/A}" \
            "${HEALTH_RESULT:-NOT RUN}"

          printf '%-34s %-12s %-18s\n' \
            "Protected endpoint / no auth" \
            "${PROTECTED_STATUS:-N/A}" \
            "${AUTH_RESULT:-NOT RUN}"

          printf '%-34s %-12s %-18s\n' \
            "Security headers" \
            "N/A" \
            "${HEADER_RESULT:-NOT RUN}"

          printf '%-34s %-12s %-18s\n' \
            "CORS observation" \
            "N/A" \
            "${CORS_RESULT:-NOT RUN}"

          echo "=============================================================="
          echo ""

      # ==========================================================
      # UPLOAD BASELINE ARTIFACTS
      # ==========================================================

      - name: Upload security baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline-${{ github.run_id }}
          path: security-baseline/
          if-no-files-found: warn
