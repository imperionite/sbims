name: PR Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: SBIMS Quality Gate

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      RATE_LIMIT_ENABLED: false
      ENVIRONMENT: test

    steps:
      - name: Start CI Timer
        id: timer
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Cache Deno Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          deno cache src/main.ts tests/unit/**/*.ts tests/integration/**/*.ts

      # ===============================
      # FORMAT CHECK
      # ===============================

      - name: Format Check
        id: format
        run: |
          START=$(date +%s)

          deno fmt --check

          END=$(date +%s)

          echo "FORMAT_TIME=$((END-START))s" >> $GITHUB_ENV

      # ===============================
      # LINT CHECK
      # ===============================

      - name: Lint Check
        id: lint
        run: |

          START=$(date +%s)

          deno lint

          END=$(date +%s)

          echo "LINT_TIME=$((END-START))s" >> $GITHUB_ENV

      # ===============================
      # TYPE CHECK
      # ===============================

      - name: Type Check
        id: typecheck
        run: |

          START=$(date +%s)

          deno check src/main.ts

          END=$(date +%s)

          echo "TYPE_TIME=$((END-START))s" >> $GITHUB_ENV

      # ===============================
      # UNIT TESTS
      # ===============================

      - name: Unit Tests
        id: unit
        run: |

          START=$(date +%s)

          deno task test:unit

          END=$(date +%s)

          echo "UNIT_TIME=$((END-START))s" >> $GITHUB_ENV

      # ===============================
      # INTEGRATION TESTS
      # ===============================

      - name: Integration Tests
        id: integration
        run: |

          START=$(date +%s)

          deno task test:integration

          END=$(date +%s)

          echo "INTEGRATION_TIME=$((END-START))s" >> $GITHUB_ENV

      # ===============================
      # FINAL TRACEABILITY REPORT
      # ===============================

      - name: SBIMS Quality Gate Report
        if: always()

        run: |

          END_TIME=$(date +%s)

          TOTAL=$((END_TIME-START_TIME))


          echo ""

          echo "======================================================================"
          echo "                         SBIMS QUALITY GATE"
          echo "======================================================================"

          echo ""

          echo "Repository : ${{ github.repository }}"
          echo "Workflow   : PR Quality Gate"
          echo "Branch     : ${{ github.head_ref }}"
          echo "PR         : #${{ github.event.pull_request.number }}"
          echo "Commit     : ${{ github.event.pull_request.head.sha }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Run ID     : ${{ github.run_id }}"

          echo ""

          echo "======================================================================"
          echo "QUALITY CHECKS"
          echo "======================================================================"

          echo ""

          echo "✓ Format                ${FORMAT_TIME:-FAILED}"
          echo "✓ Lint                  ${LINT_TIME:-FAILED}"
          echo "✓ Type Check            ${TYPE_TIME:-FAILED}"
          echo "✓ Unit Tests            ${UNIT_TIME:-FAILED}"
          echo "✓ Integration Tests     ${INTEGRATION_TIME:-FAILED}"

          echo ""

          echo "----------------------------------------------------------------------"
          echo "Total CI Time : ${TOTAL}s"
          echo "----------------------------------------------------------------------"

          echo ""

          if [ "${{ job.status }}" = "success" ]; then

            echo "======================================================================"
            echo "RESULT"
            echo "======================================================================"

            echo ""
            echo "STATUS : PASS"
            echo ""
            echo "✓ Ready for Human Review"

          else

            echo "======================================================================"
            echo "RESULT"
            echo "======================================================================"

            echo ""
            echo "STATUS : FAIL"
            echo ""
            echo "✗ Merge blocked - Fix required"

            exit 1

          fi
